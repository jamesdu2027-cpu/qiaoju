<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>故事動畫機</title>
<style>
:root{--bg:#e9eef5;--fg:#14213d;--card:#fff;--line:#c9d3e2;--ac:#2f4bd6;--acfg:#fff;--mut:#5a6785;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101626;--fg:#e8edf8;--card:#192238;--line:#2c3856;--ac:#8fa2ff;--acfg:#101626;--mut:#9aa8c8}}
:root[data-theme="dark"]{--bg:#101626;--fg:#e8edf8;--card:#192238;--line:#2c3856;--ac:#8fa2ff;--acfg:#101626;--mut:#9aa8c8}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 "PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
main{max-width:920px;margin:0 auto;padding:18px 14px 40px}
h1{font-size:26px;margin:4px 0 2px;letter-spacing:.04em}
.sub{color:var(--mut);margin:0 0 14px;font-size:14px}
.stage{background:#000;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
canvas{display:block;width:100%;height:auto}
.prog{height:4px;background:var(--line)}
.prog div{height:100%;width:0;background:var(--ac)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}
button{font:inherit;border:1px solid var(--ac);background:transparent;color:var(--ac);padding:8px 16px;border-radius:8px;cursor:pointer}
button.main{background:var(--ac);color:var(--acfg)}
button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
select{font:inherit;padding:7px 8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
label{font-size:14px;color:var(--mut);display:flex;align-items:center;gap:6px}
textarea{width:100%;min-height:150px;font:inherit;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);resize:vertical}
.msg{min-height:1.6em;font-size:14px;color:var(--mut);margin:4px 0}
#out{margin-top:14px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
#out video{width:100%;border-radius:8px;background:#000}
details{margin-top:14px;color:var(--mut);font-size:14px}
</style>
</head>
<body>
<main>
<h1>故事動畫機</h1>
<p class="sub">寫幾句話，自動分成場景、配上背景和角色，生成動畫，還能錄成視頻。</p>

<div class="stage"><canvas id="cv" width="960" height="540"></canvas><div class="prog"><div id="bar"></div></div></div>

<div class="row">
  <button class="main" id="play">播放</button>
  <button id="rec">錄製視頻</button>
  <button id="stop" disabled>停止</button>
  <select id="spd" aria-label="速度"><option value="0.75">慢速</option><option value="1" selected>正常</option><option value="1.5">快速</option></select>
  <label><input type="checkbox" id="tts"> 播放時朗讀</label>
</div>
<div class="msg" id="msg" role="status"></div>

<textarea id="story" aria-label="故事內容">清晨，小女孩帶著小貓走進森林。
她們遇到一隻害羞的兔子，一起跳過小溪。
夜晚，月亮升起，大家在星空下唱歌。
第二天，她們坐著小船出海，看見一條大魚在游。</textarea>

<div id="out" hidden>
  <video id="pv" controls playsinline></video>
  <div class="row"><button class="main" id="save">保存視頻</button><span class="msg" id="smsg"></span></div>
</div>

<details><summary>怎麼運作？</summary>
<p>每個句子是一個場景。程式會找關鍵字：「夜、海、森林、雪、雨、城、沙漠」決定背景；「貓、兔、小女孩、龍、船、月亮」等決定角色；「跑、飛、游、跳」決定動作。句子越長，場景越久。朗讀只在播放時有聲音，不會錄進視頻。</p></details>
</main>

<script>
const $=id=>document.getElementById(id),cv=$('cv'),ctx=cv.getContext('2d'),W=960,H=540,G=410;
const R=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const BGS=[[/夜|晚|月|星空/,'night'],[/海|浪|魚|游/,'sea'],[/雪|冬/,'snow'],[/雨/,'rain'],[/森林|樹林|林|森/,'forest'],[/城|街|樓/,'city'],[/沙漠/,'desert']];
const ACT=[[/小女孩|女孩|公主|女/,'👧','a'],[/男孩|王子|少年|男/,'👦','a'],[/老人|爺爺|奶奶/,'🧓','a'],[/貓/,'🐱','a'],[/狗/,'🐶','a'],[/兔/,'🐰','a'],[/熊/,'🐻','a'],[/狐/,'🦊','a'],[/龍/,'🐉','a'],[/魚/,'🐟','a'],[/鳥|燕/,'🐦','a'],[/蝴蝶/,'🦋','a'],[/馬/,'🐴','a'],[/虎/,'🐯','a'],[/猴/,'🐵','a'],[/豬/,'🐷','a'],[/機器人/,'🤖','a'],[/外星/,'👽','a'],[/鬼|幽靈/,'👻','a'],[/船/,'⛵','a'],[/車/,'🚗','a'],[/飛機/,'✈️','a'],[/火箭/,'🚀','a'],[/月亮/,'🌙','p'],[/星/,'⭐','p'],[/太陽/,'☀️','p'],[/花/,'🌸','p'],[/樹/,'🌳','p'],[/房子|屋/,'🏠','p'],[/蛋糕/,'🎂','p'],[/禮物/,'🎁','p'],[/愛/,'❤️','p'],[/寶藏|金幣/,'💰','p'],[/書/,'📖','p']];
let scenes=[],total=0,raf=0,rec=null,blob=null;

function build(){
  const k=parseFloat($('spd').value)||1;
  scenes=$('story').value.split(/(?<=[。！？!?\n；;])/).map(s=>s.trim()).filter(Boolean).map(t=>{
    let bg='day';for(const[r,b]of BGS)if(r.test(t)){bg=b;break}
    const f=[];ACT.forEach(([r,e,kd])=>{const i=t.search(r);if(i>=0&&!f.some(x=>x.e===e))f.push({e,kd,i})});
    f.sort((a,b)=>a.i-b.i);const actors=f.slice(0,4);if(!actors.length)actors.push({e:'✨',kd:'p'});
    const mo=/飛/.test(t)?'fly':/游|潛/.test(t)?'swim':/跳|蹦/.test(t)?'jump':/跑|走|追|去|來|奔|出發/.test(t)?'run':'idle';
    return{t,bg,actors,mo,d:Math.max(2.8,1.6+t.length*.2)/k};
  });
  total=scenes.reduce((a,s)=>a+s.d,0)+1.8;
}
function sky(a,b){const g=ctx.createLinearGradient(0,0,0,G);g.addColorStop(0,a);g.addColorStop(1,b);ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
function ground(c){ctx.fillStyle=c;ctx.fillRect(0,G,W,H-G)}
function disc(x,y,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill()}
function cloud(x,y){ctx.fillStyle='rgba(255,255,255,.88)';[[0,0,36],[38,-10,46],[80,0,34],[40,12,40]].forEach(([a,b,r])=>{ctx.beginPath();ctx.arc(x+a,y+b,r,0,7);ctx.fill()})}
function drawBg(b,t){
  if(b==='night'){sky('#0a0f33','#2b2f73');ctx.fillStyle='#fff';for(let i=0;i<60;i++){ctx.globalAlpha=.35+.65*Math.abs(Math.sin(t*2+i));ctx.fillRect(R(i)*W,R(i+99)*(G-30),2.5,2.5)}ctx.globalAlpha=1;disc(800,90,40,'#fff6c9');ground('#161a3d')}
  else if(b==='sea'){sky('#7cc8f5','#d8f1ff');disc(820,90,46,'#ffe27a');cloud((t*18+150)%1100-120,90);ctx.fillStyle='#1f7fc4';ctx.fillRect(0,330,W,H);
    ['#2a93dc','#1f7fc4','#176aa8'].forEach((c,k)=>{ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(0,H);for(let x=0;x<=W;x+=20)ctx.lineTo(x,335+k*55+Math.sin(x/60+t*2+k)*8);ctx.lineTo(W,H);ctx.fill()})}
  else if(b==='forest'){sky('#a6dcb0','#e4f6dc');for(let i=0;i<10;i++){const x=i*105+R(i)*40,h=150+R(i+3)*90;ctx.fillStyle=i%2?'#2f7a45':'#276a3c';ctx.beginPath();ctx.moveTo(x-55,G);ctx.lineTo(x,G-h);ctx.lineTo(x+55,G);ctx.fill()}ground('#3f8f4a')}
  else if(b==='snow'){sky('#b9c9dc','#eef3f9');ground('#fff')}
  else if(b==='rain'){sky('#5a6678','#9aa6b6');cloud(200,80);cloud(640,60);ground('#4c6b4f')}
  else if(b==='city'){sky('#f7a77a','#fde7c4');disc(480,300,90,'#ffd9a0');for(let i=0;i<12;i++){const w=70+R(i)*30,h=120+R(i+5)*170,x=i*82;ctx.fillStyle='#3b3f66';ctx.fillRect(x,G-h,w,h);ctx.fillStyle='#ffe58a';for(let y=G-h+14;y<G-20;y+=26)for(let xx=x+10;xx<x+w-14;xx+=22)if(R(xx+y)>.35)ctx.fillRect(xx,y,10,13)}ground('#2a2d4a')}
  else if(b==='desert'){sky('#f5b26b','#fde1a8');disc(780,110,50,'#fff1b8');ground('#e2b46e');ctx.fillStyle='#d9a25a';ctx.beginPath();ctx.ellipse(300,G+6,420,60,0,Math.PI,0);ctx.fill()}
  else{sky('#8fd3ff','#e8f7ff');disc(820,90,46,'#ffd84a');cloud((t*14+100)%1100-120,100);cloud((t*9+600)%1100-120,170);ctx.fillStyle='#74c76d';ctx.beginPath();ctx.ellipse(700,G+10,520,90,0,Math.PI,0);ctx.fill();ground('#5fb85a')}
}
function fx(b,t){
  if(b==='snow'){ctx.fillStyle='#fff';for(let i=0;i<90;i++){const y=(R(i+50)*H+t*(40+60*R(i+7)))%H,x=R(i)*W+Math.sin(t+i)*20;ctx.beginPath();ctx.arc(x,y,2+R(i+9)*3,0,7);ctx.fill()}}
  if(b==='rain'){ctx.strokeStyle='rgba(210,228,255,.75)';ctx.lineWidth=2;ctx.beginPath();for(let i=0;i<110;i++){const y=(R(i+50)*H+t*520*(.7+R(i+7)*.5))%H,x=R(i)*W;ctx.moveTo(x,y);ctx.lineTo(x-6,y+20)}ctx.stroke()}
}
function actors(s,t,u){
  ctx.font='110px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  const n=s.actors.length;
  s.actors.forEach((a,i)=>{
    let x=W*(i+1)/(n+1),y=s.bg==='sea'?385:G-5,sc=1,fl=1;
    if(a.kd==='a'){
      if(s.mo==='run'){x+=(u-.5)*320;fl=-1;y-=Math.abs(Math.sin(t*9+i))*14}
      else if(s.mo==='fly'){x+=(u-.5)*240;y=190+Math.sin(t*2+i)*30;fl=-1}
      else if(s.mo==='swim'){x+=(u-.5)*240;y=395+Math.sin(t*3+i)*14;fl=-1}
      else if(s.mo==='jump')y-=Math.abs(Math.sin(t*4+i))*90;
      else y+=Math.sin(t*3+i)*5;
    }else{sc=1+.04*Math.sin(t*3+i);if(/[⭐🌙☀️]/.test(a.e))y=130+Math.sin(t*2+i)*10}
    const p=Math.min(1,t/.5),pop=1-Math.pow(1-p,3);
    ctx.save();ctx.translate(x,y);ctx.scale(fl*sc*pop,sc*pop);ctx.fillText(a.e,0,0);ctx.restore();
  });
}
function wrap(tx,max){const L=[];let l='';for(const c of tx){if(ctx.measureText(l+c).width>max){L.push(l);l=c}else l+=c}L.push(l);return L}
function caption(tx,u){
  ctx.font='600 30px "PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif';ctx.textAlign='center';ctx.textBaseline='alphabetic';
  const L=wrap(tx,820),h=L.length*42+26,y0=H-h-22;
  ctx.fillStyle='rgba(8,12,28,.74)';ctx.fillRect(50,y0,W-100,h);
  let left=Math.ceil([...tx].length*Math.min(1,u/.7));ctx.fillStyle='#fff';
  L.forEach((l,i)=>{const c=[...l];const part=c.slice(0,Math.max(0,left)).join('');left-=c.length;ctx.textAlign='left';const w=ctx.measureText(l).width;ctx.fillText(part,W/2-w/2,y0+40+i*42)});
}
function frame(el){
  let acc=0;
  for(let i=0;i<scenes.length;i++){const s=scenes[i];
    if(el<acc+s.d){const t=el-acc,u=t/s.d;ctx.clearRect(0,0,W,H);drawBg(s.bg,t);actors(s,t,u);fx(s.bg,t);caption(s.t,u);
      const a=Math.min(1,t/.35,(s.d-t)/.35);ctx.fillStyle='rgba(0,0,0,'+(1-a)+')';ctx.fillRect(0,0,W,H);return i}
    acc+=s.d}
  const t=el-acc;ctx.clearRect(0,0,W,H);drawBg('night',t);ctx.font='700 120px "PingFang TC","Noto Sans TC",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#fff';ctx.globalAlpha=Math.min(1,t/.6);ctx.fillText('完',W/2,H/2);ctx.globalAlpha=1;return scenes.length;
}
function msg(t){$('msg').textContent=t}
function ui(on){$('play').disabled=$('rec').disabled=on;$('stop').disabled=!on}
function play(opts){
  build();if(!scenes.length){msg('請先寫下故事。');return}
  cancelAnimationFrame(raf);speechSynthesis&&speechSynthesis.cancel();msg('');ui(true);
  const t0=performance.now();let last=-1;const talk=$('tts').checked&&!opts.silent&&window.speechSynthesis;
  const tick=now=>{
    const el=(now-t0)/1000;
    if(el>=total){frame(total-.01);$('bar').style.width='100%';ui(false);opts.done&&opts.done();return}
    const i=frame(el);$('bar').style.width=(el/total*100)+'%';
    if(talk&&i!==last){last=i;speechSynthesis.cancel();if(i<scenes.length){const u=new SpeechSynthesisUtterance(scenes[i].t);u.lang='zh-TW';u.rate=1.05;speechSynthesis.speak(u)}}
    raf=requestAnimationFrame(tick)};
  raf=requestAnimationFrame(tick);
}
function stop(){cancelAnimationFrame(raf);window.speechSynthesis&&speechSynthesis.cancel();if(rec&&rec.state!=='inactive'){rec.discard=true;rec.stop()}rec=null;ui(false)}
function record(){
  if(!window.MediaRecorder||!cv.captureStream){msg('這個瀏覽器不支援錄製視頻。');return}
  const mime=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(m=>MediaRecorder.isTypeSupported(m));
  if(!mime){msg('這個瀏覽器不支援 WebM 錄製。');return}
  const ch=[],mr=new MediaRecorder(cv.captureStream(30),{mimeType:mime,videoBitsPerSecond:6e6});rec=mr;
  mr.ondataavailable=e=>e.data.size&&ch.push(e.data);
  mr.onstop=()=>{if(mr.discard)return;blob=new Blob(ch,{type:'video/webm'});$('pv').src=URL.createObjectURL(blob);$('out').hidden=false;msg('錄製完成。');$('out').scrollIntoView({behavior:'smooth',block:'nearest'})};
  mr.start();msg('錄製中，請等動畫播完……');
  play({silent:true,done:()=>setTimeout(()=>{if(mr.state!=='inactive')mr.stop();rec=null},300)});
}
function save(){
  if(!blob)return;
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='story.webm';
  document.body.appendChild(a);a.click();a.remove();$('smsg').textContent='已開始下載。';
}
function preview(){build();if(scenes.length)frame(Math.min(1.4,scenes[0].d*.5))}
$('play').onclick=()=>play({});$('rec').onclick=record;$('stop').onclick=stop;$('save').onclick=save;
$('story').addEventListener('input',()=>{if($('stop').disabled)preview()});$('spd').onchange=()=>{if($('stop').disabled)preview()};
preview();
</script>
</body>
</html>
