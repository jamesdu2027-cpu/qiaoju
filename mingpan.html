<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>奇門命盤 · 本命宮查詢</title>
<style>
:root{--bg:#eef1f0;--card:#fbfcfb;--ink:#1d2a2f;--mute:#5d6b70;--line:#cfd8d6;--hit:#1f5c5a;--hitbg:#dcebe8;--btn:#1f5c5a;--btnink:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#121819;--card:#1a2324;--ink:#e3ebea;--mute:#93a3a6;--line:#2f3d3f;--hit:#7fd0c8;--hitbg:#1d3a39;--btn:#7fd0c8;--btnink:#0e1a1a}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.7 system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1{font:700 32px/1.2 "Noto Serif TC","Songti TC","PMingLiU",serif;letter-spacing:.12em;margin:8px 0 6px}
.sub{color:var(--mute);margin:0 0 18px;font-size:14px}
form{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
label{font-size:13px;color:var(--mute);display:block}
input{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 10px;margin-top:4px}
button{grid-column:1/-1;font:inherit;font-weight:600;background:var(--btn);color:var(--btnink);border:0;border-radius:6px;padding:11px;cursor:pointer}
:focus-visible{outline:2px solid var(--hit);outline-offset:2px}
#err{color:#b3402f;margin:10px 0 0;min-height:1em;font-size:14px}
#out[hidden]{display:none}
.pillars{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;margin:22px 0 6px;border-bottom:1px solid var(--line);padding-bottom:12px}
.pillars small{display:block;font-size:12px;color:var(--mute)}
.pillars b{font:700 30px/1.15 "Noto Serif TC","Songti TC","PMingLiU",serif;display:block;letter-spacing:.05em}
.meta{color:var(--mute);font-size:14px;margin:8px 0 14px}
.ming{background:var(--hitbg);border-left:4px solid var(--hit);padding:12px 14px;border-radius:4px;margin:0 0 16px}
.ming strong{font:700 22px "Noto Serif TC","Songti TC","PMingLiU",serif;color:var(--hit)}
.ming p{margin:4px 0 0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.cell{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px 8px 10px;min-height:96px;position:relative}
.cell small{color:var(--mute);font-size:12px;display:block}
.cell .gan{font:700 30px/1.2 "Noto Serif TC","Songti TC","PMingLiU",serif;margin-top:4px;display:block}
.cell.hit{background:var(--hitbg);border:2px solid var(--hit)}
.cell.hit::after{content:"本命";position:absolute;right:6px;top:6px;font-size:12px;font-weight:700;color:var(--hit)}
.note{color:var(--mute);font-size:13px;margin-top:18px}
</style>
</head>
<body>
<main>
<h1>奇門命盤</h1>
<p class="sub">輸入出生日期與時間（北京時間），查看本命宮落在九宮的哪一格。</p>

<form id="f">
  <label>出生日期<input type="date" id="d" required></label>
  <label>出生時間<input type="time" id="t" value="12:00" required></label>
  <button type="submit">排命盤</button>
</form>
<p id="err" role="alert"></p>

<section id="out" hidden>
  <div class="pillars" id="pillars"></div>
  <p class="meta" id="meta"></p>
  <div class="ming" id="ming"></div>
  <div class="grid" id="grid"></div>
  <p class="note">本命宮取法：以出生日的日干，在地盤中所落的宮位為本命宮（日干為甲時，取該旬的旬首儀）；落中五宮則寄坤二宮。節氣為天文計算，交節前後約 15 分鐘內可能有誤差；23:00 後出生以次日日柱計。僅供傳統文化參考。</p>
</section>
</main>

<script>
const GAN='甲乙丙丁戊己庚辛壬癸', ZHI='子丑寅卯辰巳午未申酉戌亥';
const TERM_NAMES=['冬至','小寒','大寒','立春','雨水','驚蟄','春分','清明','穀雨','立夏','小滿','芒種','夏至','小暑','大暑','立秋','處暑','白露','秋分','寒露','霜降','立冬','小雪','大雪'];
const JU=[[1,7,4],[2,8,5],[3,9,6],[8,5,2],[9,6,3],[1,7,4],[3,9,6],[4,1,7],[5,2,8],[4,1,7],[5,2,8],[6,3,9],
          [9,3,6],[8,2,5],[7,1,4],[2,5,8],[1,4,7],[9,3,6],[7,1,4],[6,9,3],[5,8,2],[6,9,3],[5,8,2],[4,7,1]];
const SIX=['戊','己','庚','辛','壬','癸','丁','丙','乙'];
const XUN=['戊','己','庚','辛','壬','癸'];
const PAL={1:['坎一宮','北方・水','聰慧、應變、人生起伏大，重思考與內在力量。'],
 2:['坤二宮','西南・土','包容踏實，重家庭與人際照應，善於默默累積。'],
 3:['震三宮','東方・木','行動力強，敢開創，個性急、重先機。'],
 4:['巽四宮','東南・木','擅溝通與交際，人緣好，重文書、資訊與規劃。'],
 5:['中五宮','中央・土','中宮寄坤二宮。'],
 6:['乾六宮','西北・金','有領導與擔當，重原則，貴人運較顯。'],
 7:['兌七宮','西方・金','口才佳，重人情與享受，財與喜悅並見。'],
 8:['艮八宮','東北・土','穩重沉靜，重積累，凡事止而後進。'],
 9:['離九宮','南方・火','才華外顯，重名聲與熱情，注意情緒起伏。']};
const LAYOUT=[4,9,2,3,5,7,8,1,6];

function jdn(y,m,d){const a=Math.floor((14-m)/12),yy=y+4800-a,mm=m+12*a-3;
  return d+Math.floor((153*mm+2)/5)+365*yy+Math.floor(yy/4)-Math.floor(yy/100)+Math.floor(yy/400)-32045;}
function sunLon(jd){const n=jd-2451545.0,L=280.460+0.9856474*n,g=(357.528+0.9856003*n)*Math.PI/180;
  return (((L+1.915*Math.sin(g)+0.020*Math.sin(2*g))%360)+360)%360;}

function compute(y,m,d,h,mi){
  const local=jdn(y,m,d)-0.5+(h+mi/60)/24;
  const lon0=sunLon(local-8/24);
  let Y=y; if(lon0>=270&&lon0<315&&m<=2) Y=y-1;
  const ys=((Y-4)%10+10)%10, yb=((Y-4)%12+12)%12;
  const mIdx=Math.floor((((lon0-315)%360)+360)%360/30);
  const ms=((ys%5)*2+2+mIdx)%10, mb=(2+mIdx)%12;
  let dd=jdn(y,m,d); if(h>=23) dd+=1;
  const di=(((dd-2451545+54)%60)+60)%60, ds=di%10, db=di%12;
  const hb=Math.floor(((h+1)%24)/2), hs=((ds%5)*2+hb)%10;
  const back=di%5, fi=di-back, fdn=dd-back;
  const lonF=sunLon(fdn-0.5+23.99/24-8/24);
  const k=Math.floor((((lonF-270)%360)+360)%360/15);
  const fb=fi%12;
  const yuan=[0,3,6,9].includes(fb)?0:[2,5,8,11].includes(fb)?1:2;
  const yang=k<12, ju=JU[k][yuan];
  const dipan={};
  for(let i=0;i<9;i++){
    const p=yang?((ju-1+i)%9)+1:((((ju-1-i)%9)+9)%9)+1;
    dipan[p]=SIX[i];
  }
  const dayGan=GAN[ds]==='甲'?XUN[Math.floor(di/10)]:GAN[ds];
  let ming=Number(Object.keys(dipan).find(p=>dipan[p]===dayGan)), jicun=false;
  if(ming===5){ming=2;jicun=true;}
  return {pillars:[[GAN[ys]+ZHI[yb],'年柱'],[GAN[ms]+ZHI[mb],'月柱'],[GAN[ds]+ZHI[db],'日柱'],[GAN[hs]+ZHI[hb],'時柱']],
    yang,ju,yuan:['上元','中元','下元'][yuan],term:TERM_NAMES[k],dipan,dayGan,ming,jicun};
}

if(typeof document!=='undefined'){
  const $=id=>document.getElementById(id);
  $('f').addEventListener('submit',e=>{
    e.preventDefault(); $('err').textContent='';
    const [y,m,d]=$('d').value.split('-').map(Number), [h,mi]=$('t').value.split(':').map(Number);
    if(!y||y<1900||y>2100||isNaN(h)){$('err').textContent='請輸入 1900–2100 年之間的出生日期與時間。';return;}
    const r=compute(y,m,d,h,mi);
    $('pillars').innerHTML=r.pillars.map(p=>`<div><small>${p[1]}</small><b>${p[0]}</b></div>`).join('');
    $('meta').textContent=`${r.yang?'陽':'陰'}遁${'零一二三四五六七八九'[r.ju]}局 · ${r.yuan} · 節氣：${r.term}`;
    const P=PAL[r.ming];
    $('ming').innerHTML=`<strong>本命宮：${P[0]}</strong><p>日干「${r.dayGan}」落${r.jicun?'中五宮，寄':''}${P[0]}（${P[1]}）。</p><p>${P[2]}</p>`;
    $('grid').innerHTML=LAYOUT.map(p=>{
      return `<div class="cell${p===r.ming?' hit':''}"><small>${PAL[p][0]}</small><span class="gan">${r.dipan[p]}</span><small>${PAL[p][1]}</small></div>`;
    }).join('');
    $('out').hidden=false;
  });
}
</script>
</body>
</html>
