const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function norm(s){return String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().trim()}
function find(raw){const s=norm(raw);let best=null,len=0;
 for(const d of D){for(const name of d){const n=norm(name);
  const ascii=/^[\x00-\x7f]+$/.test(n);
  const ok=n.length<4&&ascii?s===n:(s===n||(n.length>=2&&s.includes(n)));
  if(ok&&n.length>len){best=d;len=n.length}}}return best}
let LANG="zh",LAST=null;

 [...$("chips").children].forEach(c=>c.onclick=()=>{$("q").value=D[+c.dataset.i][idx];go()});
 if(LAST!==null)go(true)}
function card(title,desc,links,t){return "<div class='card'><b>"+esc(title)+"</b>"+(desc?"<span>"+esc(desc)+"</span><br>":"")+
 links.map((l,i)=>"<a class='"+(i?"bk":"")+"' target='_blank' rel='noopener' href='"+esc(l[1])+"'>"+esc(l[0]||(i?t.goog:t.open))+"</a>").join("")+"</div>"}
function go(keep){const t=T[LANG];const raw=keep?LAST:$("q").value.trim();
 if(!raw){$("out").innerHTML="<p>"+esc(t.empty)+"</p>";return}
 LAST=raw;const d=find(raw),term=d?d[0]:raw,e=encodeURIComponent;
 const g=q=>"https://www.google.com/search?q="+e(q);
 const site=(s)=>g(term+" site:"+s);
 const fields=d?(FIELDS[d[0]]||["general"]):["general","rare"];
 let h="";if(!d)h+="<p class='note'>"+esc(t.unknown)+"</p>";

 h+=card("ClinicalTrials.gov",t.ct,[["","https://clinicaltrials.gov/search?cond="+e(term)],["",site("clinicaltrials.gov")]],t);

 $("out").innerHTML=h}
