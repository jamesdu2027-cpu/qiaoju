const $=id=>document.getElementById(id);

function setLang(){
 LANG=$("lang").value;document.documentElement.lang=LANG;const t=L[LANG];
 $("warn").textContent=t.warn;$("ttl").textContent=t.title;document.title=t.title;$("intro").textContent=t.intro;
 $("s1").textContent=t.s1;$("s2").textContent=t.s2;$("meL").textContent=t.me;$("mateL").textContent=t.mate;
 [...$("me").options].forEach(o=>o.textContent=o.value==="m"?t.male:t.female);
 [...$("mate").options].forEach(o=>o.textContent=o.value==="m"?t.male:t.female);
 $("s4").textContent=t.s4;$("faceL").textContent=t.faceL;$("eyeL").textContent=t.eyeL;$("mouthL").textContent=t.mouthL;
 const fill=(id,arr,v)=>{const s=$(id);s.innerHTML=arr.map((x,i)=>"<option value='"+i+"'>"+esc(x)+"</option>").join("");s.value=v};
 fill("face",t.shapes,F.face);fill("eyes",t.eyeO,F.eyes);fill("mouth",t.mouthO,F.mouth);
 $("go").textContent=t.go;$("note").textContent=t.note;
 const sel=[...document.querySelectorAll("#traits input:checked")].map(i=>+i.value);
 $("traits").innerHTML=t.traits.map((x,i)=>"<label><input type='checkbox' value='"+i+"'"+(sel.includes(i)?" checked":"")+" onchange='limit(this)'><span>"+esc(x)+"</span></label>").join("");
 updateS3();if(LASTRES)make(true)}
function parentWord(){return $("mate").value==="m"?L[LANG].father:L[LANG].mother}
function updateS3(){const t=L[LANG];$("s3").textContent=t.s3.replace("{P}",parentWord());$("hint").textContent=t.hint}
function limit(el){if(document.querySelectorAll("#traits input:checked").length>3)el.checked=false}

["face","eyes","mouth"].forEach(id=>$(id).addEventListener("change",()=>{F[id]=+$(id).value}));

function onFile(){const f=$("file").files[0];if(!f)return;

// ---- 测量（输入68个点） ----
const d=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function measure(p){
 const faceW=d(p[0],p[16]);
 let browY=Math.min(...p.slice(17,27).map(q=>q.y));
 const faceH=(p[8].y-browY)*1.3;
 const r=faceH/faceW,jaw=d(p[4],p[12])/faceW;
 let face;
 if(r<1.2)face=jaw>0.78?3:0;else if(r>1.38)face=2;else face=1;
 const eyeW=(d(p[36],p[39])+d(p[42],p[45]))/2,gap=d(p[39],p[42])/eyeW;
 const eyes=gap<0.9?0:gap>1.15?2:1;
 const m=d(p[48],p[54])/faceW;const mouth=m<0.3?0:m>0.38?2:1;
 return{face,eyes,mouth,r,gap,m}}

async function detect(){
 if(!IMG)return false;
 if(typeof faceapi==="undefined")return false;
 const M="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/model/";
 await faceapi.nets.tinyFaceDetector.loadFromUri(M);
 await faceapi.nets.faceLandmark68TinyNet.loadFromUri(M);
 const r=await faceapi.detectSingleFace(IMG,new faceapi.TinyFaceDetectorOptions({inputSize:416})).withFaceLandmarks(true);
 if(!r)return false;
 const p=r.landmarks.positions,m=measure(p);
 F.face=m.face;F.eyes=m.eyes;F.mouth=m.mouth;
 // 肤色：取两颊中点附近的小块平均色
 try{const c=document.createElement("canvas");c.width=IMG.naturalWidth;c.height=IMG.naturalHeight;const x=c.getContext("2d");x.drawImage(IMG,0,0);
  const pts=[[p[3],p[31]],[p[13],p[35]]];let R=0,G=0,B=0,n=0;
  pts.forEach(([a,b])=>{const cx=(a.x+b.x)/2,cy=(a.y+b.y)/2,s=Math.max(3,d(p[0],p[16])*0.05);
   const dt=x.getImageData(Math.max(0,cx-s),Math.max(0,cy-s),s*2,s*2).data;for(let i=0;i<dt.length;i+=4){R+=dt[i];G+=dt[i+1];B+=dt[i+2];n++}});
  if(n)SKIN=[Math.round(R/n),Math.round(G/n),Math.round(B/n)]}catch(e){}
 ["face","eyes","mouth"].forEach(k=>$(k).value=F[k]);
 return true}

function avatarSVG(face,eyes,mouth,gender,skin,seed){
 const sk=skin?"rgb("+skin.join(",")+")":"#f1c9a5";
 const hairs=["#2b1d14","#4a2f1b","#1a1a1a","#6b4423"],hair=hairs[seed%hairs.length];
 const w=[96,92,84,100][face]||92,h=[104,112,128,106][face]||112;
 const ex=[20,26,33][eyes]||26,mw=[10,16,23][mouth]||16;
 const rx=face===3?18:w;const ry=face===3?18:h;
 const faceEl=face===3?'<rect x="'+(120-w)+'" y="'+(130-h)+'" width="'+(w*2)+'" height="'+(h*2)+'" rx="34" fill="'+sk+'"/>':'<ellipse cx="120" cy="140" rx="'+w+'" ry="'+h+'" fill="'+sk+'"/>';
 const female=gender==="f";
 const back=female?'<path d="M18 150 C18 20 222 20 222 150 L222 270 L190 270 L190 160 L50 160 L50 270 L18 270 Z" fill="'+hair+'"/>':"";
 const front=female?'<path d="M32 118 C40 36 200 36 208 118 C170 70 70 70 32 118 Z" fill="'+hair+'"/>'
  :'<path d="M36 112 C30 30 210 30 204 112 C190 74 150 66 120 70 C90 66 50 74 36 112 Z" fill="'+hair+'"/>';
 const eyeY=135;
 const eye=(cx)=>'<ellipse cx="'+cx+'" cy="'+eyeY+'" rx="8" ry="'+(female?9:7)+'" fill="#fff"/><circle cx="'+cx+'" cy="'+eyeY+'" r="4.5" fill="#2b1d14"/><circle cx="'+(cx+1.5)+'" cy="'+(eyeY-1.5)+'" r="1.4" fill="#fff"/>';
 const lash=female?'<path d="M'+(120-ex-10)+' '+(eyeY-6)+' q10 -9 20 0 M'+(120+ex-10)+' '+(eyeY-6)+' q10 -9 20 0" stroke="#2b1d14" stroke-width="2" fill="none"/>':"";
 const my=190+Math.max(0,(h-112)/4);
 return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 290" width="220" height="266"><rect width="240" height="290" rx="16" fill="#fdeef0"/>'+back
  +'<rect x="104" y="'+(my-10)+'" width="32" height="70" rx="12" fill="'+sk+'"/>'
  +'<path d="M50 290 Q120 215 190 290 Z" fill="'+(female?"#c76a82":"#4d6fa3")+'"/>'
  +faceEl+front+eye(120-ex)+eye(120+ex)
  +'<path d="M'+(120-ex-10)+' '+(eyeY-17)+' q10 -7 20 0" stroke="'+hair+'" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M'+(120+ex-10)+' '+(eyeY-17)+' q10 -7 20 0" stroke="'+hair+'" stroke-width="3" fill="none" stroke-linecap="round"/>'
  +lash+'<path d="M120 148 q-5 14 0 18 q5 2 8 -2" stroke="#b98a68" stroke-width="2" fill="none" stroke-linecap="round"/>'
  +'<path d="M'+(120-mw)+' '+my+' Q120 '+(my+14)+' '+(120+mw)+' '+my+'" stroke="#b5475f" stroke-width="3.5" fill="none" stroke-linecap="round"/>'
  +'<circle cx="'+(120-w*0.55)+'" cy="'+(my-12)+'" r="9" fill="#f6a5b0" opacity=".45"/><circle cx="'+(120+w*0.55)+'" cy="'+(my-12)+'" r="9" fill="#f6a5b0" opacity=".45"/></svg>'}

async function make(keep){
 const t=L[LANG];
 if(!keep){$("out").innerHTML="<p>"+esc(t.busy)+"</p>";
  let ok=false;try{ok=await detect()}catch(e){ok=false}
  $("det").textContent=IMG?(ok?t.ok:t.noface):""}

 const tr=[...document.querySelectorAll("#traits input:checked")].map(i=>t.traits[+i.value]);
 const a=t.shapes[f.face],b=t.eyeO[f.eyes],c=t.mouthO[f.mouth];
 const svg=avatarSVG(f.face,f.eyes,f.mouth,gender,SKIN,f.face*3+f.eyes+f.mouth);
 const sep=(LANG==="zh"||LANG==="ja")?"、":", ";
 let h="<div class='card'><div class='res'>"+(IMG?"<div><div class='note'>"+esc(t.resFeat)+"</div><img class='ph' src='"+esc($("prev").src)+"'></div>":"")

 +"<div style='flex:1;min-width:230px'><h3 style='margin-top:0'>"+esc(t.resChar)+"</h3><p>"+esc(t.look.replace("{a}",a).replace("{b}",b).replace("{c}",c))+"</p><p>"+esc(tr.length?t.charT.replace("{P}",P).replace("{t}",tr.join(sep)):t.charN)+"</p>"

function savePng(){const s=document.querySelector("#av svg");if(!s)return;

 img.onload=()=>{const c=document.createElement("canvas");c.width=480;c.height=580;c.getContext("2d").drawImage(img,0,0,480,580);
  c.toBlob(b=>{const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="soulmate.png";a.click()})};
