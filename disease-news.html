 ["depression","抑郁症","depression","depresión","trầm cảm","โรคซึมเศร้า","우울증","うつ病","დეპრესია"],
 ["kidney disease","肾病","kidney disease","enfermedad renal","bệnh thận","โรคไต","신장병","腎臓病","თირკმლის დაავადება"],
 ["obesity","肥胖","obesity","obesidad","béo phì","โรคอ้วน","비만","肥満","სიმსუქნე"]
];

let LANG="zh", LAST=null;
const $=id=>document.getElementById(id);
function norm(s){return String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().trim()}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

// 在输入里找最长匹配的病名（任何一种语言都行）
function find(raw){
 const s=norm(raw); let best=null,len=0;
 for(const d of D){
  for(const name of d){
   const n=norm(name);
   if((s===n||(n.length>=2&&s.includes(n)))&&n.length>len){best=d;len=n.length}
  }
 }
 return best;
}

function setLang(){
 LANG=$("lang").value;
 const t=T[LANG], idx=1+L.indexOf(LANG);
 document.title=t.title;
 $("warn").textContent=t.warn;
 $("ttl").textContent=t.title;
 $("intro").textContent=t.intro;
 $("q").placeholder=t.ph;
 $("btn").textContent=t.btn;
 $("lt").textContent=t.latest;
 $("topics").textContent=t.topics;
 $("note").textContent=t.note;
 $("chips").innerHTML=D.map((d,i)=>"<a class='chip' onclick='pick("+i+")'>"+esc(d[idx])+"</a>").join("");
 if(LAST) go(true);
}
function pick(i){ $("q").value=D[i][1+L.indexOf(LANG)]; go(); }
function redo(){ if(LAST) go(true); }

function go(keep){
 const t=T[LANG];
 const raw=(keep===true&&LAST)?LAST:$("q").value.trim();
 if(!raw){$("out").innerHTML=esc(t.empty);return}
 LAST=raw;
 const d=find(raw), term=d?d[0]:raw;
 const e=encodeURIComponent, latest=$("latest").checked;
 const g=site=>"https://www.google.com/search?q="+e(term+" site:"+site)+(latest?"&tbs=qdr:y":"");
 const S=[
  [t.fdaT,t.fdaD,"https://www.fda.gov/search?s="+e(term),g("fda.gov")],
  [t.sciT,t.sciD,"https://www.science.org/action/doSearch?AllField="+e(term),g("science.org")],
  [t.natT,t.natD,"https://www.nature.com/search?q="+e(term)+"&order="+(latest?"date_desc":"relevance"),g("nature.com")]
 ];
 let h="<p class='note'>"+(d?esc(t.kw)+" <b>"+esc(term)+"</b>":esc(t.unknown))+"</p>";
 S.forEach(x=>{
  h+="<div class='card'><h3>"+esc(x[0])+"</h3><p>"+esc(x[1])+"</p><a class='go' target='_blank' rel='noopener' href='"+esc(x[2])+"'>"+esc(t.open)+"</a><a class='bk' target='_blank' rel='noopener' href='"+esc(x[3])+"'>"+esc(t.backup)+"</a></div>";
 });
 $("out").innerHTML=h;
}

$("q").addEventListener("keydown",ev=>{if(ev.key==="Enter")go()});
setLang();
</script>
