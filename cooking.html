let CAT='all',QRY='',CUR=null,SRV=0;
const RG={sc:['川菜','Sichuan'],gd:['广味','Cantonese'],hn:['湘菜','Hunan']};
const DIFF=[['','',''],['简单','Easy'],['中等','Medium'],['较难','Hard']];
function fmtQ(v,u){
  if(v===0)return X('适量','to taste');
  let n;
  if(v<10){n=Math.round(v*4)/4}else if((u==='g'||u==='ml')&&v>=50){n=Math.round(v/5)*5}else{n=Math.round(v)}
  if(n===0)n=.25;
  const w=Math.floor(n),f=n-w,fr={0:'',.25:'¼',.5:'½',.75:'¾'}[f];
  return (w?String(w):'')+fr;
}
function unitTxt(u,n){const d=U[u]||U[''];if(!EN())return d[0];return n>1?d[2]:d[1]}
function ingLine(it,k){
  const q=it[2]*k;const t=fmtQ(q,it[3]);
  if(it[2]===0)return t;
  const num=Math.round(q*4)/4;
  const ut=unitTxt(it[3],num);
  return t+(ut?(EN()||it[3]==='g'||it[3]==='ml'?' ':'')+ut:'');
}
function timeTxt(t){const h=Math.floor(t/60),m=t%60;return EN()?(h?h+' h ':'')+(m?m+' min':'').trim():(h?h+' 小时':'')+(m?(h?' ':'')+m+' 分钟':'')}
function chips(r){return `<div class="meta"><span class="chip">${r.r?X(RG[r.r][0],RG[r.r][1]):r.c==='cn'?X('中餐','Chinese'):X('西餐','Western')}</span><span class="chip">${timeTxt(r.t)}</span><span class="chip">${X(DIFF[r.d][0],DIFF[r.d][1])}</span></div>`}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function renderList(){
  const q=QRY.trim().toLowerCase();
  const rs=R.filter(r=>(CAT==='all'||((CAT==='cn'||CAT==='we')?r.c===CAT:r.r===CAT))&&(!q||(r.zh+' '+r.en+' '+r.i.map(i=>i[0]+' '+i[1]).join(' ')).toLowerCase().includes(q)));
  $('list').innerHTML=rs.length?rs.map(r=>`<button type="button" class="rc ${r.c}" data-id="${r.id}"><b>${esc(X(r.zh,r.en))}</b><span class="o">${esc(X(r.en,r.zh))}</span>${chips(r)}</button>`).join(''):`<p class="note">${X('没有找到，换个词试试。','Nothing found. Try another word.')}</p>`;
}
function renderDetail(){
  const r=R.find(x=>x.id===CUR);if(!r)return;
  const k=SRV/r.s;
  $('detail').innerHTML=`<div class="card">
    <button type="button" id="back" class="noprint">← ${X('返回','Back')}</button>
    <h2 style="margin-top:14px">${esc(X(r.zh,r.en))}</h2><div class="note">${esc(X(r.en,r.zh))}</div>${chips(r)}
    <div class="srv noprint"><span>${X('份数','Servings')}</span><button type="button" id="dec" aria-label="${X('减少份数','Fewer servings')}">−</button><b id="sv">${SRV}</b><button type="button" id="inc" aria-label="${X('增加份数','More servings')}">+</button></div>
    <h3>${X('食材','Ingredients')} <span class="note">（${X('按 '+SRV+' 人份','for '+SRV+' servings')}）</span></h3>
    <ul class="ing">${r.i.map(it=>`<li><span>${esc(X(it[0],it[1]))}</span><span class="q">${esc(ingLine(it,k))}</span></li>`).join('')}</ul>
    <h3>${X('做法','Method')}</h3>
    <ol class="st">${r.st.map(s=>`<li>${esc(X(s[0],s[1]))}</li>`).join('')}</ol>
    <div class="tip">💡 ${esc(X(r.tip[0],r.tip[1]))}</div>
    <div class="row noprint" style="display:flex;gap:10px;margin-top:16px"><button type="button" class="main" id="copy">${X('复制食材清单','Copy shopping list')}</button><button type="button" id="print">${X('打印','Print')}</button><span class="note" id="cmsg"></span></div>
  </div>`;
  $('back').onclick=()=>show(null);
  $('dec').onclick=()=>{if(SRV>1){SRV--;renderDetail()}};
  $('inc').onclick=()=>{if(SRV<12){SRV++;renderDetail()}};
  $('print').onclick=()=>window.print();
  $('copy').onclick=async()=>{
    const txt=X(r.zh,r.en)+'（'+SRV+X(' 人份）\n',' servings)\n')+r.i.map(it=>'- '+X(it[0],it[1])+'：'+ingLine(it,k)).join('\n');
    try{await navigator.clipboard.writeText(txt);$('cmsg').textContent=X('已复制。','Copied.')}catch(e){$('cmsg').textContent=X('无法自动复制。','Could not copy automatically.')}
  };
}
function show(id){
  CUR=id;
  if(id){const r=R.find(x=>x.id===id);SRV=r.s;$('list').hidden=true;$('bar').hidden=true;$('detail').hidden=false;renderDetail();try{history.replaceState(null,'','#'+id)}catch(e){}window.scrollTo(0,0)}
  else{$('detail').hidden=true;$('list').hidden=false;$('bar').hidden=false;try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}renderList()}
}
function renderStatic(){
  document.documentElement.lang=EN()?'en':'zh-CN';
  document.title=X('中西料理','Chinese & Western Cooking');
  $('h1').textContent=X('中西料理','Chinese & Western Cooking');
  {const n=k=>R.filter(r=>r.r===k).length,cn=R.filter(r=>r.c==='cn').length,we=R.length-cn;$('sub').textContent=X(`共 ${R.length} 道家常菜：中餐 ${cn} 道（川菜 ${n('sc')}、广味 ${n('gd')}、湘菜 ${n('hn')}，其余家常菜），西餐 ${we} 道。可以调整份数，食材用量会自动换算。`,`${R.length} home recipes: ${cn} Chinese (${n('sc')} Sichuan, ${n('gd')} Cantonese, ${n('hn')} Hunan, plus other home dishes) and ${we} Western. Change the servings and the quantities adjust automatically.`)}
  {const n=k=>R.filter(r=>r.r===k).length,L={all:[X('全部','All'),R.length],cn:[X('中餐','Chinese'),R.filter(r=>r.c==='cn').length],sc:[X('川菜','Sichuan'),n('sc')],gd:[X('广味','Cantonese'),n('gd')],hn:[X('湘菜','Hunan'),n('hn')],we:[X('西餐','Western'),R.filter(r=>r.c==='we').length]};
  document.querySelectorAll('.tab').forEach(b=>{const l=L[b.dataset.c];b.textContent=l[0]+' '+l[1];b.setAttribute('aria-pressed',b.dataset.c===CAT?'true':'false')})}
  $('q').placeholder=X('搜索菜名或食材','Search a dish or ingredient');
  $('foot').textContent=X('用量和时间是参考，每家的灶火和烤箱不同，请边做边尝。肉类请彻底做熟。','Quantities and times are guides. Stoves and ovens vary, so taste as you go and cook meat thoroughly.');
  if(CUR)renderDetail();else renderList();
}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{CAT=b.dataset.c;renderStatic()}));
$('q').addEventListener('input',e=>{QRY=e.target.value;renderList()});
$('list').addEventListener('click',e=>{const b=e.target.closest('.rc');if(b)show(b.dataset.id)});
function setLang(v){LANG=v;try{localStorage.setItem('lang',v)}catch(e){}renderStatic()}
$('lang').addEventListener('click',()=>setLang(EN()?'zh':'en'));
window.addEventListener('storage',e=>{if(e.key==='lang'){LANG=/^en/i.test(e.newValue||'')?'en':'zh';renderStatic()}});
renderStatic();
{const m=/^#(\w+)$/.exec(location.hash);if(m&&R.some(r=>r.id===m[1]))show(m[1])}
</script>
