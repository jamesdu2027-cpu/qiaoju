<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>天南海北 · 華人社區</title>
<style>
:root{--bg:#f4f6f5;--card:#fff;--ink:#17262b;--mute:#62727a;--line:#dbe3e1;--brand:#0d5c63;--soft:#e3f0ef}
@media(prefers-color-scheme:dark){:root{--bg:#101a1c;--card:#172427;--ink:#e6efee;--mute:#92a5a8;--line:#2a3b3e;--brand:#5cc3c9;--soft:#1d3235}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif}
header{background:var(--brand);color:#fff;display:flex;align-items:center;gap:10px;padding:8px 14px;flex-wrap:wrap}
header b{font-size:20px}nav{flex:1;display:flex;gap:4px} 
header button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:6px;padding:6px 12px;cursor:pointer;font:inherit}
nav button.on{background:#fff;color:var(--brand)}
main{max-width:860px;margin:auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:14px}
.cats{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px}
.cats button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:7px 10px;cursor:pointer;font:inherit}
.cats button.on{border-color:var(--brand);background:var(--soft)}
.row{padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer;display:flex;justify-content:space-between;gap:10px}
.row span,.meta{color:var(--mute);font-size:13px}
input,textarea,select{width:100%;border:1px solid var(--line);border-radius:6px;padding:8px;font:inherit;background:var(--bg);color:var(--ink);margin-bottom:8px}
.btn{background:var(--brand);color:#fff;border:0;border-radius:6px;padding:7px 14px;cursor:pointer;font:inherit}
.body{white-space:pre-wrap}
#msgs{max-height:55vh;overflow-y:auto}
.send{display:flex;gap:8px;margin-top:8px}.send input{margin:0}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);max-width:340px;width:90%} 
</style></head><body>
<header><b>天南海北</b><nav id="nav"></nav><span id="who"></span></header> <div style="display:flex;justify-content:center;flex-wrap:wrap;gap:6px 18px;padding:10px"><a href="story-animator-site.html" style="display:block;text-align:center;padding:10px;color:var(--brand);font-weight:700;text-decoration:none">故事動畫</a><a href="qimen.html" style="display:block;text-align:center;padding:10px;color:var(--brand);font-weight:700;text-decoration:none">奇門遁甲</a><a href="jiedu.html" style="display:block;text-align:center;padding:10px;color:var(--brand);font-weight:700;text-decoration:none">命盤解讀</a><a href="tcm.html" style="display:block;text-align:center;padding:10px;color:var(--brand);font-weight:700;text-decoration:none">中醫養生</a><a href="shici.html" style="display:block;text-align:center;padding:10px;color:var(--brand);font-weight:700;text-decoration:none">詩詞笑話</a></div> 
<main id="app"></main>
<footer class="meta" style="text-align:center;padding:16px">版權投訴與廣告合作：richujianghua888@gmail.com</footer>
<dialog id="dlg"><h3>登入／註冊</h3>
<input id="em" type="email" placeholder="電子信箱"><input id="pw" type="password" placeholder="密碼（至少 6 位）"><input id="nk" placeholder="暱稱（註冊時填寫）">
<p class="meta" id="am"></p>
<button class="btn" onclick="signIn()">登入</button> <button class="btn" onclick="signUp()">註冊</button> <button class="btn" style="background:none;color:var(--brand)" onclick="dlg.close()">取消</button></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="app.js"></script>
</body></html>
