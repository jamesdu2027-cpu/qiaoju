<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 音樂創作 · 天南海北</title>
<style>
:root{--bg:#f4f6f5;--card:#fff;--ink:#17262b;--mute:#62727a;--line:#dbe3e1;--brand:#0d5c63}
@media(prefers-color-scheme:dark){:root{--bg:#101a1c;--card:#172427;--ink:#e6efee;--mute:#92a5a8;--line:#2a3b3e;--brand:#5cc3c9}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif}
main{max-width:560px;margin:0 auto;padding:24px 14px 48px}
.back{display:inline-block;margin-bottom:16px;color:var(--brand);text-decoration:none;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:20px}
h1{margin:0 0 14px;font-size:21px}
p{margin:0 0 14px}
a.btn{display:inline-block;padding:10px 20px;border-radius:6px;background:var(--brand);color:#fff;text-decoration:none}
a.btn:hover{opacity:.9}
small{display:block;margin-top:16px;font-size:12px;color:var(--mute)}
</style>
</head>
<body>
<main>
  <a class="back" href="/">← 返回首頁</a>
  <div class="card">
    <h1>🎵 用 AI 寫一首歌</h1>
    <p>輸入一句靈感或歌詞，幾十秒生成完整歌曲，由 MiniMax 音樂模型提供。</p>
    <a class="btn" href="https://www.minimax.io/audio" target="_blank" rel="noopener noreferrer">去創作音樂 →</a>
    <small>點擊後將跳轉到第三方網站 MiniMax Audio，本站與其無隸屬關係。AI 生成的音樂公開分享時，建議註明「由 AI 創作」。</small>
  </div>
</main>
</body>
</html>
