<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>音乐编曲坊</title>
<style>
:root{color-scheme:light;--bg:#f6f4ee;--fg:#1f2428;--mute:#5d666e;--line:#ddd8ca;--card:#fffdf8;--accent:#0d5c63;--accent-ink:#fff;--cell:#f1efe7;--ph:#cfe4e2;--hi:#2a9aa4;--bad:#a8322d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181b;--fg:#e7e4dc;--mute:#9aa3ab;--line:#33383d;--card:#1c2024;--accent:#5cc3c9;--accent-ink:#06191b;--cell:#252a2f;--ph:#254a4d;--hi:#9be3e8;--bad:#e07a72;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15181b;--fg:#e7e4dc;--mute:#9aa3ab;--line:#33383d;--card:#1c2024;--accent:#5cc3c9;--accent-ink:#06191b;--cell:#252a2f;--ph:#254a4d;--hi:#9be3e8;--bad:#e07a72;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.7 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding:20px max(16px,env(safe-area-inset-right,0px)) 64px max(16px,env(safe-area-inset-left,0px))}
main{max-width:1000px;margin:0 auto}
h1{font:700 30px/1.3 "Songti SC","STSong","SimSun",serif;margin:4px 0 0;letter-spacing:.1em}
.sub{color:var(--mute);margin:4px 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--mute);margin:0 0 3px}
select{width:100%;font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
input[type=range]{width:100%;accent-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.mood{margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.mood textarea{width:100%;min-height:64px;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);resize:vertical;box-sizing:border-box}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
.opt{display:flex;align-items:center;gap:6px;font-size:15px;color:var(--fg);margin:0}
button{font:inherit;padding:7px 16px;border-radius:6px;border:1.5px solid var(--accent);background:transparent;color:var(--accent);font-weight:700;cursor:pointer}
button.main{background:var(--accent);color:var(--accent-ink)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.note{font-size:13px;color:var(--mute)}
.sec{font-weight:700;font-size:14px;margin:14px 0 4px;color:var(--fg)}
.sec:first-child{margin-top:0}
.scroll{overflow-x:auto}
.inner{min-width:640px}
.gridbox{display:grid;grid-template-columns:56px repeat(32,minmax(14px,1fr));touch-action:none;user-select:none;-webkit-user-select:none}
.lab{font-size:11px;color:var(--mute);padding-right:6px;text-align:right;line-height:20px;white-space:nowrap}
.lab.root{color:var(--accent);font-weight:700}
.c{height:20px;background:var(--cell);border-left:1px solid var(--line);border-bottom:1px solid var(--line);cursor:pointer}
.c.bar{border-left:2px solid var(--mute)}
.c.on{background:var(--accent)}
.c.ph{background:var(--ph)}
.c.on.ph{background:var(--hi)}
.chordbox{display:grid;grid-template-columns:56px repeat(4,1fr)}
.chordbox .cc{padding:0 4px}
.langbtn{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));z-index:10;padding:6px 12px;border-radius:16px;font-size:13px;background:var(--accent);color:var(--accent-ink)}
html[lang="en"] body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;line-height:1.6}
html[lang="en"] h1{letter-spacing:0}
</style>
</head>
<body>
<button type="button" id="lang" class="langbtn" aria-label="Language / 语言">中 / EN</button>
<main>
<h1 data-en="Music Composer">音乐编曲坊</h1>
<p class="sub" data-en="Click the grid to write a melody, or let it compose for you. Play it, export WAV or MIDI, and share it with a link.">点格子写旋律，或让它自动编曲。可以播放、导出 WAV 和 MIDI，还能生成分享链接发给朋友。</p>

<div class="card">
  <div class="mood">
    <label for="mood" data-en="Write how you feel (e.g. “Late autumn, I miss my mother and want to visit her grave”) and it will compose to match">写下你的心情（比如“晚秋想念母亲，想去墓地看她，草长高了遮住了小路”），程序会按心情编曲</label>
    <textarea id="mood" maxlength="300"></textarea>
    <div class="row" style="margin-top:8px"><button class="main" id="moodGo" data-en="Compose from my feeling">按心情编曲</button><span id="moodMsg" class="note"></span></div>
  </div>
  <div class="grid">
    <div><label for="style" data-en="Style (for Auto-compose)">风格（用于自动编曲）</label><select id="style"></select></div>
    <div><label for="root" data-en="Key">调</label><select id="root"></select></div>
    <div><label for="scale" data-en="Scale">音阶</label><select id="scale"></select></div>
    <div><label for="inst" data-en="Lead sound">主旋律音色</label><select id="inst"></select></div>
    <div><label for="bass" data-en="Bass">贝斯</label><select id="bass"></select></div>
    <div><label for="bpm"><span data-en="Tempo">速度</span> <b id="bpmv"></b></label><input type="range" id="bpm" min="60" max="180" step="1"></div>
  </div>
  <div class="row">
    <button class="main" id="auto" data-en="Auto-compose">自动编曲</button>
    <button id="play" data-en="Play">播放</button>
    <button id="clear" data-en="Clear melody">清空旋律</button>
    <label class="opt"><input type="checkbox" id="pad"> <span data-en="Chord pad">和弦铺底</span></label>
    <label class="opt"><input type="checkbox" id="strum"> <span data-en="Guitar strum">吉他扫弦</span></label>
    <label class="opt"><input type="checkbox" id="comp"> <span data-en="Piano comping">钢琴伴奏</span></label>
    <label class="opt"><input type="checkbox" id="swing"> <span data-en="Swing feel">摇摆节奏</span></label>
    <label class="opt"><input type="checkbox" id="seventh"> <span data-en="Seventh chords">七和弦</span></label>
  </div>
  <div class="row">
    <button id="wav" data-en="Export WAV">导出 WAV</button>
    <button id="midi" data-en="Export MIDI">导出 MIDI</button>
    <button id="link" data-en="Copy share link">复制分享链接</button>
    <button id="save" data-en="Save on this device">保存到本机</button>
    <button id="load" data-en="Load saved">读取已保存</button>
  </div>
  <p class="note" id="msg" role="status" style="margin:10px 0 0"></p>
</div>

<div class="card">
  <div class="scroll"><div class="inner">
    <div class="sec" data-en="Melody (click or drag; neighbouring cells join into one long note)">旋律（点击或拖动；相邻的格子连成长音）</div>
    <div id="roll" class="gridbox"></div>
    <div class="sec" data-en="Chords (one per bar)">和弦（每小节一个）</div>
    <div id="chords" class="chordbox"></div>
    <div class="sec" data-en="Drums">鼓</div>
    <div id="drums" class="gridbox"></div>
  </div></div>
  <p class="note" style="margin:10px 0 0" data-en="Four bars of 4/4, each cell is an eighth note. Press the space bar to play or stop.">共 4 小节，每格是一个八分音符。按空格键可以播放或停止。</p>
</div>
</main>

<script>
/* ===== 语言 ===== */
let LANG='zh';
try{const m=/[?&]lang=([\w-]+)/.exec(location.search),v=m?m[1]:localStorage.getItem('lang');if(v&&/^en/i.test(v))LANG='en'}catch(e){}
const EN=()=>LANG==='en',X=(zh,en)=>LANG==='en'?en:zh;
const $=id=>document.getElementById(id);

/* ===== 数据 ===== */
const N=32;
const MAJ=[0,2,4,5,7,9,11],MIN=[0,2,3,5,7,8,10];
const BASES={major:MAJ,minor:MIN,pentMaj:[0,2,4,7,9],pentMin:[0,3,5,7,10],blues:[0,3,5,6,7,10]};
const NOTE=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const S={root:0,scale:'major',bpm:110,inst:'pluck',bass:'root',pad:true,strum:false,swing:false,seventh:false,comp:false,mel:[],drum:{k:[],s:[],h:[]},chords:[1,5,6,4]};
const blank=()=>Array(N).fill(0);
const zeros=n=>Array.from({length:n},blank);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const int7=()=>(S.scale==='minor'||S.scale==='pentMin'||S.scale==='blues')?MIN:MAJ;
function rowSemis(scale){const b=BASES[scale||S.scale],o=[];for(let k=0;k<2;k++)b.forEach(x=>o.push(x+12*k));o.push(24);return o}
const noteName=m=>NOTE[((m%12)+12)%12]+(Math.floor(m/12)-1);
const stepDur=()=>60/S.bpm/2;
const hz=m=>440*Math.pow(2,(m-69)/12);
const ROMAN_MAJ=['I','ii','iii','IV','V','vi','vii°'],ROMAN_MIN=['i','ii°','III','iv','v','VI','VII'];
function chordName(d){
  const iv=int7(),r=iv[d-1],t=(iv[(d+1)%7]-r+12)%12,f=(iv[(d+3)%7]-r+12)%12,sv=(iv[(d+5)%7]-r+12)%12,n=NOTE[(S.root+r)%12];
  if(S.seventh){if(t===3)return n+(f===6?'m7b5':(sv===11?'mMaj7':'m7'));return n+(sv===11?'maj7':'7')}
  return n+(t===3?(f===6?'dim':'m'):'');
}
function chordMidis(d){const iv=int7(),o=[];for(const k of (S.seventh?[0,2,4,6]:[0,2,4])){const i=d-1+k;o.push(45+S.root+iv[i%7]+12*Math.floor(i/7))}return o}
function chordPcs(d){const iv=int7(),a=[iv[d-1],iv[(d+1)%7],iv[(d+3)%7]];if(S.seventh)a.push(iv[(d+5)%7]);return a.map(x=>x%12)}
const compSteps=bar=>bar%2?[0,3,6]:[0,3];
const fold=m=>m>52?m-12:m;
function bassHits(bar){
  const d=S.chords[bar],r=36+S.root+int7()[d-1],o=[];
  if(S.bass==='root'){o.push({s:0,m:r,l:4},{s:4,m:r,l:4})}
  else if(S.bass==='walk'){
    const iv=int7(),r0=36+S.root+iv[d-1],th=(iv[(d+1)%7]-iv[d-1]+12)%12,f5=(iv[(d+3)%7]-iv[d-1]+12)%12,nr=36+S.root+iv[S.chords[(bar+1)%4]-1];
    o.push({s:0,m:fold(r0),l:2},{s:2,m:fold(r0+th),l:2},{s:4,m:fold(r0+f5),l:2},{s:6,m:fold(nr-1),l:2});
  }else if(S.bass==='alt'){o.push({s:0,m:r,l:2},{s:4,m:r+7,l:2})}
  else if(S.bass==='eighth'){for(let s=0;s<8;s++)o.push({s,m:r+(s%2?12:0),l:1})}
  return o;
}
let evDirty=true,evMap={};
function melEvents(){
  const rows=rowSemis(),ev=[];
  for(let r=0;r<rows.length;r++){let s=0;const a=S.mel[r]||[];while(s<N){if(a[s]){let e=s;while(e<N&&a[e])e++;ev.push({step:s,len:e-s,midi:60+S.root+rows[r]});s=e}else s++}}
  return ev;
}
function melAt(step){if(evDirty){evMap={};melEvents().forEach(n=>{(evMap[n.step]=evMap[n.step]||[]).push(n)});evDirty=false}return evMap[step]||[]}

/* ===== 声音 ===== */
const NB=new WeakMap();
function noise(ctx){let b=NB.get(ctx);if(!b){b=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);const d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;NB.set(ctx,b)}return b}
function makeMaster(ctx){const g=ctx.createGain();g.gain.value=.8;const c=ctx.createDynamicsCompressor();g.connect(c);c.connect(ctx.destination);return g}
function lead(ctx,dest,t,m,dur,inst){
  const f=hz(m),g=ctx.createGain();g.connect(dest);
  const osc=(type,fr,vol)=>{const o=ctx.createOscillator();o.type=type;o.frequency.setValueAtTime(fr,t);const gg=ctx.createGain();gg.gain.value=vol;o.connect(gg);gg.connect(g);return o};
  let end,os;
  if(inst==='flute'){
    const o=osc('sine',f,1),o2=osc('sine',f*2,.12),lfo=ctx.createOscillator(),lg=ctx.createGain();
    lfo.frequency.value=5.5;lg.gain.value=9;lfo.connect(lg);lg.connect(o.detune);lg.connect(o2.detune);
    g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.2,t+.07);g.gain.setValueAtTime(.2,t+Math.max(.08,dur-.05));g.gain.linearRampToValueAtTime(.0001,t+dur+.12);
    end=t+dur+.15;os=[o,o2,lfo];
  }else if(inst==='violin'||inst==='erhu'){
    const er=inst==='erhu';
    const mk=det=>{const o=ctx.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(er?f*.97:f,t);if(er)o.frequency.linearRampToValueAtTime(f,t+.07);o.detune.value=det;return o};
    const o1=mk(-4),o2=mk(4),lfo=ctx.createOscillator(),lg=ctx.createGain();
    lfo.frequency.value=er?5.8:5.3;lg.gain.setValueAtTime(0,t);lg.gain.linearRampToValueAtTime(er?16:9,t+.25);
    lfo.connect(lg);lg.connect(o1.detune);lg.connect(o2.detune);
    if(er){
      [[800,2.5,1],[2300,3,.7]].forEach(([fr,q,v])=>{const b=ctx.createBiquadFilter();b.type='bandpass';b.frequency.value=fr;b.Q.value=q;const gg=ctx.createGain();gg.gain.value=v;o1.connect(b);o2.connect(b);b.connect(gg);gg.connect(g)});
    }else{
      const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=3200;lp.Q.value=.7;o1.connect(lp);o2.connect(lp);lp.connect(g);
    }
    const pk=er?.36:.14;
    g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(pk,t+(er?.06:.09));g.gain.setValueAtTime(pk*.9,t+Math.max(.1,dur-.06));g.gain.linearRampToValueAtTime(.0001,t+dur+.14);
    end=t+dur+.17;os=[o1,o2,lfo];
  }else if(inst==='panpipe'){
    const o=osc('sine',f,1),o2=osc('triangle',f*2,.08);
    const ns=ctx.createBufferSource();ns.buffer=noise(ctx);ns.loop=true;
    const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=f*2;bp.Q.value=6;
    const ng=ctx.createGain();ng.gain.value=.5;ns.connect(bp);bp.connect(ng);ng.connect(g);
    g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.2,t+.05);g.gain.setValueAtTime(.2,t+Math.max.apply(null,[.06,dur-.05]));g.gain.linearRampToValueAtTime(.0001,t+dur+.1);
    end=t+dur+.13;os=[o,o2,ns];
  }else if(inst==='sax'){
    const o1=ctx.createOscillator();o1.type='sawtooth';o1.frequency.setValueAtTime(f,t);
    const o2=ctx.createOscillator();o2.type='square';o2.frequency.setValueAtTime(f,t);o2.detune.value=3;
    const g2=ctx.createGain();g2.gain.value=.5;
    const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.setValueAtTime(900,t);lp.frequency.linearRampToValueAtTime(Math.min(f*5,2600),t+.12);lp.Q.value=3;
    o1.connect(lp);o2.connect(g2);g2.connect(lp);lp.connect(g);
    const ns=ctx.createBufferSource();ns.buffer=noise(ctx);ns.loop=true;const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=2500;bp.Q.value=1;const ng=ctx.createGain();ng.gain.value=.05;ns.connect(bp);bp.connect(ng);ng.connect(g);
    const lfo=ctx.createOscillator(),lg=ctx.createGain();lfo.frequency.value=5;lg.gain.setValueAtTime(0,t);lg.gain.setValueAtTime(0,t+.2);lg.gain.linearRampToValueAtTime(12,t+.5);lfo.connect(lg);lg.connect(o1.detune);lg.connect(o2.detune);
    g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.2,t+.04);g.gain.setValueAtTime(.18,t+Math.max.apply(null,[.05,dur-.05]));g.gain.linearRampToValueAtTime(.0001,t+dur+.12);
    end=t+dur+.15;os=[o1,o2,lfo,ns];
  }else if(inst==='synth'){
    const o=ctx.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(f,t);
    const fl=ctx.createBiquadFilter();fl.type='lowpass';fl.frequency.value=2000;o.connect(fl);fl.connect(g);
    g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.16,t+.01);g.gain.setValueAtTime(.12,t+Math.max(.02,dur-.05));g.gain.linearRampToValueAtTime(.0001,t+dur+.15);
    end=t+dur+.18;os=[o];
  }else{
    const pl=inst==='pluck',decay=pl?Math.min(dur+.5,1.3):Math.min(dur+.9,2.2);
    const o1=osc('triangle',f,1),o2=osc('sine',f*2,pl?.35:.22),o3=osc('sine',f*3,pl?.1:.06);
    g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.32,t+.006);g.gain.exponentialRampToValueAtTime(.001,t+decay);
    os=[o1,o2,o3];
    if(!pl){
      const o4=osc('triangle',f*1.003,.5);os.push(o4);
      g.disconnect();const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.setValueAtTime(Math.min(f*8,6000),t);lp.frequency.exponentialRampToValueAtTime(Math.max(f*1.5,500),t+decay);g.connect(lp);lp.connect(dest);
    }
    end=t+decay+.05;
  }
  os.forEach(o=>{o.start(t);o.stop(end)});
}
function padv(ctx,dest,t,m,dur){
  const o=ctx.createOscillator();o.type='triangle';o.frequency.setValueAtTime(hz(m),t);
  const g=ctx.createGain();g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.05,t+.2);g.gain.setValueAtTime(.05,t+dur-.3);g.gain.linearRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(dest);o.start(t);o.stop(t+dur+.02);
}
function bassv(ctx,dest,t,m,dur){
  const o=ctx.createOscillator();o.type='triangle';o.frequency.setValueAtTime(hz(m),t);
  const d=Math.min(dur,.9),g=ctx.createGain();g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.4,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g);g.connect(dest);o.start(t);o.stop(t+d+.05);
}
function kick(ctx,dest,t){const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.setValueAtTime(160,t);o.frequency.exponentialRampToValueAtTime(45,t+.12);g.gain.setValueAtTime(.9,t);g.gain.exponentialRampToValueAtTime(.001,t+.28);o.connect(g);g.connect(dest);o.start(t);o.stop(t+.3)}
function snare(ctx,dest,t){
  const s=ctx.createBufferSource();s.buffer=noise(ctx);const f=ctx.createBiquadFilter();f.type='bandpass';f.frequency.value=1800;
  const g=ctx.createGain();g.gain.setValueAtTime(.45,t);g.gain.exponentialRampToValueAtTime(.001,t+.16);s.connect(f);f.connect(g);g.connect(dest);s.start(t);s.stop(t+.2);
  const o=ctx.createOscillator();o.type='triangle';o.frequency.setValueAtTime(190,t);const g2=ctx.createGain();g2.gain.setValueAtTime(.3,t);g2.gain.exponentialRampToValueAtTime(.001,t+.1);o.connect(g2);g2.connect(dest);o.start(t);o.stop(t+.12);
}
function hat(ctx,dest,t,ride){const s=ctx.createBufferSource();s.buffer=noise(ctx);const f=ctx.createBiquadFilter();f.type='highpass';f.frequency.value=ride?5000:7000;const g=ctx.createGain();g.gain.setValueAtTime(ride?.12:.18,t);g.gain.exponentialRampToValueAtTime(.001,t+(ride?.3:.05));s.connect(f);f.connect(g);g.connect(dest);s.start(t);s.stop(t+(ride?.34:.08))}
function playStep(ctx,dest,step,t0){
  const sd=stepDur(),t=(S.swing&&step%2)?t0+sd/3:t0;
  melAt(step).forEach(n=>lead(ctx,dest,t,n.midi,n.len*sd*.92,S.inst));
  if(S.drum.k[step])kick(ctx,dest,t);
  if(S.drum.s[step])snare(ctx,dest,t);
  if(S.drum.h[step])hat(ctx,dest,t,S.swing);
  const bar=Math.floor(step/8),st=step%8;
  if(st===0&&S.pad)chordMidis(S.chords[bar]).forEach(m=>padv(ctx,dest,t,m,8*sd));
  bassHits(bar).forEach(h=>{if(h.s===st)bassv(ctx,dest,t,h.m,h.l*sd)});
  if(S.comp&&compSteps(bar).includes(st)){const sub=ctx.createGain();sub.gain.value=.5;sub.connect(dest);chordMidis(S.chords[bar]).slice(1).forEach((m,i)=>lead(ctx,sub,t+i*.01,m,.5,'piano'))}

  const on=c.classList.contains('on');paint={v:!on,k:c.dataset.k};setCell(c,!on);
}));
window.addEventListener('pointermove',e=>{if(!paint)return;const c=cellAt(e.clientX,e.clientY);if(c&&c.dataset.k===paint.k&&c.classList.contains('on')!==paint.v)setCell(c,paint.v)});
window.addEventListener('pointerup',()=>{paint=null});
window.addEventListener('pointercancel',()=>{paint=null});

/* 播放 */
let playing=false,timer=null,nextT=0,cur=0,visQ=[],bus=null,raf=0,phStep=-1;
function setPH(s){if(phStep>=0)cols[phStep].forEach(c=>c.classList.remove('ph'));phStep=s;if(s>=0)cols[s].forEach(c=>c.classList.add('ph'))}
function setPlayBtn(){$('play').textContent=playing?X('停止','Stop'):X('播放','Play')}
function sched(){const sd=stepDur();while(nextT<AC.currentTime+.12){playStep(AC,bus,cur,nextT);visQ.push({s:cur,t:nextT});cur=(cur+1)%N;nextT+=sd}}
function vis(){if(!playing)return;while(visQ.length&&visQ[0].t<=AC.currentTime)setPH(visQ.shift().s);raf=requestAnimationFrame(vis)}
function play(){
  if(!ensureAC()){setMsg('noaudio');return}
  bus=AC.createGain();bus.connect(master);playing=true;cur=0;nextT=AC.currentTime+.08;visQ=[];
  timer=setInterval(sched,25);raf=requestAnimationFrame(vis);setPlayBtn();
}
function stop(){
  clearInterval(timer);playing=false;cancelAnimationFrame(raf);
  if(bus){const b=bus;b.gain.setTargetAtTime(0,AC.currentTime,.03);setTimeout(()=>{try{b.disconnect()}catch(e){}},400);bus=null}
  setPH(-1);setPlayBtn();
}
const hasNotes=()=>melEvents().length>0||S.drum.k.some(Boolean)||S.drum.s.some(Boolean);

$('play').onclick=()=>{playing?stop():play()};
let moodRes=null;
function showMood(){$('moodMsg').textContent=moodRes?(moodRes.found?X('听出的心情：','Feeling: ')+X(moodRes.name[0],moodRes.name[1]):X('没读出明显的情绪，用了宁静的风格。可以多写几句。','No clear feeling found, so I used a calm style. Try writing a bit more.')):''}
$('moodGo').onclick=()=>{const t=$('mood').value.trim();if(!t){$('moodMsg').textContent=X('先写几句话。','Write a few words first.');return}moodRes=moodCompose(t);showMood();setMsg(null);if(!playing)play()};
$('auto').onclick=()=>{autoCompose();setMsg(null);if(!playing)play()};
$('clear').onclick=()=>{S.mel=zeros(rowSemis().length);evDirty=true;buildGrid()};
$('root').onchange=e=>{S.root=+e.target.value;evDirty=true;buildGrid()};
$('scale').onchange=e=>changeScale(e.target.value);
$('inst').onchange=e=>{S.inst=e.target.value};
$('bass').onchange=e=>{S.bass=e.target.value};
$('pad').onchange=e=>{S.pad=e.target.checked};
$('strum').onchange=e=>{S.strum=e.target.checked};
$('comp').onchange=e=>{S.comp=e.target.checked};
$('swing').onchange=e=>{S.swing=e.target.checked};
$('seventh').onchange=e=>{S.seventh=e.target.checked;buildGrid()};
$('bpm').oninput=e=>{S.bpm=+e.target.value;$('bpmv').textContent=S.bpm};
$('midi').onclick=()=>{if(!hasNotes()){setMsg('empty');return}download(midiBytes(),'music.mid','audio/midi');setMsg('done')};
$('wav').onclick=async()=>{
  if(!hasNotes()){setMsg('empty');return}
  setMsg('busy');$('wav').disabled=true;
  try{download(await renderWav(2),'music.wav','audio/wav');setMsg('done')}catch(e){setMsg('fail')}
  $('wav').disabled=false;
};
$('link').onclick=async()=>{
  const u=location.href.split('#')[0]+'#s='+b64(JSON.stringify(pack()));
  try{await navigator.clipboard.writeText(u);setMsg('link')}catch(e){setMsg('linkno')}
  try{history.replaceState(null,'','#s='+b64(JSON.stringify(pack())))}catch(e){}
};
$('save').onclick=()=>{try{localStorage.setItem('music_project_v1',JSON.stringify(pack()));setMsg('saved')}catch(e){setMsg('fail')}};
$('load').onclick=()=>{
  let o=null;try{o=JSON.parse(localStorage.getItem('music_project_v1'))}catch(e){}
  if(o&&unpack(o)){syncUI();buildGrid();setMsg('loaded')}else setMsg('none');
};
window.addEventListener('keydown',e=>{if(e.code==='Space'&&!/^(INPUT|SELECT|TEXTAREA|BUTTON)$/.test(document.activeElement.tagName)){e.preventDefault();playing?stop():play()}});

/* 语言切换 */
function applyStatic(){
  document.documentElement.lang=EN()?'en':'zh-CN';
  document.querySelectorAll('[data-en]').forEach(e=>{
    if(e.dataset.zh===undefined)e.dataset.zh=e.innerHTML;
    e.innerHTML=EN()?e.dataset.en:e.dataset.zh;
  });
  document.title=X('音乐编曲坊','Music Composer');
  document.querySelectorAll('.lab[data-en]').forEach(l=>{l.textContent=X(l.dataset.zh,l.dataset.en)});
  fillAll();syncUI();setPlayBtn();setMsg(msgK);if(typeof showMood==='function'&&moodRes)showMood();
  $('chords').querySelectorAll('select').forEach((s,i)=>s.setAttribute('aria-label',X('第 '+(i+1)+' 小节和弦','Chord for bar '+(i+1))));
}
function setLang(v){LANG=v;try{localStorage.setItem('lang',v)}catch(e){}applyStatic()}
$('lang').addEventListener('click',()=>setLang(EN()?'zh':'en'));
window.addEventListener('storage',e=>{if(e.key==='lang'){const v=(e.newValue&&/^en/i.test(e.newValue))?'en':'zh';if(v!==LANG){LANG=v;applyStatic()}}});

/* 启动：有分享链接就读它，否则先放一首自动生成的 */
(function init(){
  let ok=false;
  fillAll();
  try{const m=/#s=([\w-]+)/.exec(location.hash);if(m)ok=unpack(JSON.parse(unb64(m[1])))}catch(e){}
  if(!ok){$('style').value='guofeng';autoCompose()}
  syncUI();buildGrid();applyStatic();
})();
</script>
