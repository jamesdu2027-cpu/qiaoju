
<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>音乐编曲坊</title>
<style>
:root{color-scheme:light;--bg:#f6f4ee;--fg:#1f2428;--mute:#5d666e;--line:#ddd8ca;--card:#fffdf8;--accent:#0d5c63;--accent-ink:#fff;--cell:#f1efe7;--ph:#cfe4e2;--hi:#2a9aa4;--bad:#a8322d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181b;--fg:#e7e4dc;--mute:#9aa3ab;--line:#33383d;--card:#1c2024;--accent:#5cc3c9;--accent-ink:#06191b;--cell:#252a2f;--ph:#254a4d;--hi:#9be3e8;--bad:#e07a72;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15181b;--fg:#e7e4dc;--mute:#9aa3ab;--line:#33383d;--card:#1c2024;--accent:#5cc3c9;--accent-ink:#06191b;--cell:#252a2f;--ph:#254a4d;--hi:#9be3e8;--bad:#e07a72;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.7 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding:20px max(16px,env(safe-area-inset-right,0px)) 64px max(16px,env(safe-area-inset-left,0px))}
main{max-width:1000px;margin:0 auto}
h1{font:700 30px/1.3 "Songti SC","STSong","SimSun",serif;margin:4px 0 0;letter-spacing:.1em}
.sub{color:var(--mute);margin:4px 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--mute);margin:0 0 3px}
select{width:100%;font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
input[type=range]{width:100%;accent-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.mood{margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.mood textarea{width:100%;min-height:64px;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);resize:vertical;box-sizing:border-box}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
.opt{display:flex;align-items:center;gap:6px;font-size:15px;color:var(--fg);margin:0}
button{font:inherit;padding:7px 16px;border-radius:6px;border:1.5px solid var(--accent);background:transparent;color:var(--accent);font-weight:700;cursor:pointer}
button.main{background:var(--accent);color:var(--accent-ink)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.note{font-size:13px;color:var(--mute)}
.sec{font-weight:700;font-size:14px;margin:14px 0 4px;color:var(--fg)}
.sec:first-child{margin-top:0}
.scroll{overflow-x:auto}
.inner{min-width:640px}
.gridbox{display:grid;grid-template-columns:56px repeat(32,minmax(14px,1fr));touch-action:none;user-select:none;-webkit-user-select:none}
.lab{font-size:11px;color:var(--mute);padding-right:6px;text-align:right;line-height:20px;white-space:nowrap}
.lab.root{color:var(--accent);font-weight:700}
.c{height:20px;background:var(--cell);border-left:1px solid var(--line);border-bottom:1px solid var(--line);cursor:pointer}
.c.bar{border-left:2px solid var(--mute)}
.c.on{background:var(--accent)}
.c.ph{background:var(--ph)}
.c.on.ph{background:var(--hi)}
.chordbox{display:grid;grid-template-columns:56px repeat(4,1fr)}
.chordbox .cc{padding:0 4px}
.langbtn{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));z-index:10;padding:6px 12px;border-radius:16px;font-size:13px;background:var(--accent);color:var(--accent-ink)}
html[lang="en"] body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;line-height:1.6}
html[lang="en"] h1{letter-spacing:0}
</style>
</head>
<body>
<button type="button" id="lang" class="langbtn" aria-label="Language / 语言">中 / EN</button>
<main>
<h1 data-en="Music Composer">音乐编曲坊</h1>
<p class="sub" data-en="Click the grid to write a melody, or let it compose for you. Play it, export WAV or MIDI, and share it with a link.">点格子写旋律，或让它自动编曲。可以播放、导出 WAV 和 MIDI，还能生成分享链接发给朋友。</p>

<div class="card">
  <div class="mood">
    <label for="mood" data-en="Write how you feel (e.g. “Late autumn, I miss my mother and want to visit her grave”) and it will compose to match">写下你的心情（比如“晚秋想念母亲，想去墓地看她，草长高了遮住了小路”），程序会按心情编曲</label>
    <textarea id="mood" maxlength="300"></textarea>
    <div class="row" style="margin-top:8px">
      <select id="songLen" style="width:auto"><option value="3" data-en="About 3 min">约 3 分钟</option><option value="4" data-en="About 4 min">约 4 分钟</option><option value="5" selected data-en="About 5 min">约 5 分钟</option></select>
      <select id="soloInst" style="width:auto" title="独奏乐器"><option value="eguitar" selected data-en="Solo: electric guitar">独奏：电吉他</option><option value="erhu" data-en="Solo: erhu">独奏：二胡</option><option value="piano" data-en="Solo: piano">独奏：钢琴</option><option value="violin" data-en="Solo: violin">独奏：小提琴</option><option value="sax" data-en="Solo: saxophone">独奏：萨克斯</option><option value="flute" data-en="Solo: flute">独奏：笛子</option></select>
      <button class="main" id="songGo" data-en="Create full song">生成完整歌曲</button>
      <button id="songPlay">播放整曲</button>
      <button id="songWav" data-en="Song WAV">整曲 WAV</button>
      <button id="songMidi" data-en="Song MIDI">整曲 MIDI</button>
    </div>
    <p class="note" style="margin:8px 0 0" data-en="A full song has an intro, verses, choruses, a bridge, a key-change final chorus and an outro. It uses the feeling text above, or the style below if the box is empty.">完整歌曲有前奏、主歌、副歌、过渡段、转调的最后副歌和尾声。有心情文字就按心情编，文字框空着就按下面选的风格编。</p>
    <p class="note" id="songNow" style="margin:6px 0 0"></p><p class="note" id="songMap" style="margin:4px 0 0"></p>
    <div class="row" style="margin-top:8px"><button id="moodGo" data-en="Short sketch from my feeling">只按心情编一小段</button><span id="moodMsg" class="note"></span></div>
  </div>
  <div class="grid">
    <div><label for="style" data-en="Style (for Auto-compose)">风格（用于自动编曲）</label><select id="style"></select></div>
    <div><label for="root" data-en="Key">调</label><select id="root"></select></div>
    <div><label for="scale" data-en="Scale">音阶</label><select id="scale"></select></div>
    <div><label for="inst" data-en="Lead sound">主旋律音色</label><select id="inst"></select></div>
    <div><label for="bass" data-en="Bass">贝斯</label><select id="bass"></select></div>
    <div><label for="bpm"><span data-en="Tempo">速度</span> <b id="bpmv"></b></label><input type="range" id="bpm" min="60" max="180" step="1"></div>
  </div>
  <div class="row">
    <button class="main" id="auto" data-en="Auto-compose">自动编曲</button>
    <button id="play" data-en="Play">播放</button>
    <button id="clear" data-en="Clear melody">清空旋律</button>
    <label class="opt"><input type="checkbox" id="pad"> <span data-en="Chord pad">和弦铺底</span></label>
    <label class="opt"><input type="checkbox" id="strum"> <span data-en="Guitar strum">吉他扫弦</span></label>
    <label class="opt"><input type="checkbox" id="comp"> <span data-en="Piano comping">钢琴伴奏</span></label>
    <label class="opt"><input type="checkbox" id="real" checked> <span data-en="Real instrument sounds">真乐器音色</span></label>
    <label class="opt"><input type="checkbox" id="swing"> <span data-en="Swing feel">摇摆节奏</span></label>
    <label class="opt"><input type="checkbox" id="seventh"> <span data-en="Seventh chords">七和弦</span></label>
  </div>
  <div class="row">
    <button id="wav" data-en="Export WAV">导出 WAV</button>
    <button id="midi" data-en="Export MIDI">导出 MIDI</button>
    <button id="link" data-en="Copy share link">复制分享链接</button>
    <button id="save" data-en="Save on this device">保存到本机</button>
    <button id="load" data-en="Load saved">读取已保存</button>
  </div>
  <p class="note" id="msg" role="status" style="margin:10px 0 0"></p>
</div>

<div class="card">
  <div class="scroll"><div class="inner">
    <div class="sec" data-en="Melody (click or drag; neighbouring cells join into one long note)">旋律（点击或拖动；相邻的格子连成长音）</div>
    <div id="roll" class="gridbox"></div>
    <div class="sec" data-en="Chords (one per bar)">和弦（每小节一个）</div>
    <div id="chords" class="chordbox"></div>
    <div class="sec" data-en="Drums">鼓</div>
    <div id="drums" class="gridbox"></div>
  </div></div>
  <p class="note" style="margin:10px 0 0" data-en="Four bars of 4/4, each cell is an eighth note. Press the space bar to play or stop.">共 4 小节，每格是一个八分音符。按空格键可以播放或停止。</p>
</div>
</main>

<script>
/* 出错时在页面顶部显示红字，方便排查 */
(function(){function show(t){try{var d=document.getElementById('errbar');if(!d){d=document.createElement('div');d.id='errbar';d.style.cssText='position:fixed;left:0;right:0;top:0;z-index:99999;background:#a8322d;color:#fff;padding:8px 12px;font:14px/1.4 monospace;white-space:pre-wrap';document.body.appendChild(d)}d.textContent='出错了 / Error: '+t}catch(e){}}
window.addEventListener('error',function(e){show((e.message||'')+' @'+(e.lineno||'')+':'+(e.colno||''))});
window.addEventListener('unhandledrejection',function(e){show('promise: '+(e.reason&&e.reason.message||e.reason))})})();

/* ===== 语言 ===== */
let LANG='zh';
try{const m=/[?&]lang=([\w-]+)/.exec(location.search),v=m?m[1]:localStorage.getItem('lang');if(v&&/^en/i.test(v))LANG='en'}catch(e){}
const EN=()=>LANG==='en',X=(zh,en)=>LANG==='en'?en:zh;
const $=id=>document.getElementById(id);

/* ===== 数据 ===== */
const N=32;
const MAJ=[0,2,4,5,7,9,11],MIN=[0,2,3,5,7,8,10];
const BASES={major:MAJ,minor:MIN,pentMaj:[0,2,4,7,9],pentMin:[0,3,5,7,10],blues:[0,3,5,6,7,10]};
const NOTE=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const S={root:0,scale:'major',bpm:110,inst:'pluck',bass:'root',pad:true,strum:false,swing:false,seventh:false,comp:false,arp:null,crash:false,mel:[],drum:{k:[],s:[],h:[]},chords:[1,5,6,4]};
const blank=()=>Array(N).fill(0);
const zeros=n=>Array.from({length:n},blank);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const int7=()=>(S.scale==='minor'||S.scale==='pentMin'||S.scale==='blues')?MIN:MAJ;
function rowSemis(scale){const b=BASES[scale||S.scale],o=[];for(let k=0;k<2;k++)b.forEach(x=>o.push(x+12*k));o.push(24);return o}
const noteName=m=>NOTE[((m%12)+12)%12]+(Math.floor(m/12)-1);
let TM=1;
const stepDur=()=>60/S.bpm/2*TM;
const hz=m=>440*Math.pow(2,(m-69)/12);
const ROMAN_MAJ=['I','ii','iii','IV','V','vi','vii°'],ROMAN_MIN=['i','ii°','III','iv','v','VI','VII'];
function chordName(d){
  const iv=int7(),r=iv[d-1],t=(iv[(d+1)%7]-r+12)%12,f=(iv[(d+3)%7]-r+12)%12,sv=(iv[(d+5)%7]-r+12)%12,n=NOTE[(S.root+r)%12];
  if(S.seventh){if(t===3)return n+(f===6?'m7b5':(sv===11?'mMaj7':'m7'));return n+(sv===11?'maj7':'7')}
  return n+(t===3?(f===6?'dim':'m'):'');
}
function chordMidis(d){const iv=int7(),o=[];for(const k of (S.seventh?[0,2,4,6]:[0,2,4])){const i=d-1+k;o.push(45+S.root+iv[i%7]+12*Math.floor(i/7))}return o}
function chordPcs(d){const iv=int7(),a=[iv[d-1],iv[(d+1)%7],iv[(d+3)%7]];if(S.seventh)a.push(iv[(d+5)%7]);return a.map(x=>x%12)}
const compSteps=bar=>bar%2?[0,3,6]:[0,3];
const fold=m=>m>52?m-12:m;
function bassHits(bar){
  const d=S.chords[bar],r=36+S.root+int7()[d-1],o=[];
  const busy=S.drum.k.some(Boolean);
  if(S.bass==='root'){
    if(!busy){o.push({s:0,m:r,l:4},{s:4,m:r,l:4})}
    else{o.push({s:0,m:r,l:3,v:1},{s:3,m:r,l:1,v:.55},{s:4,m:r,l:2,v:.85},{s:6,m:fold(r+7),l:2,v:.7})}
  }
  else if(S.bass==='walk'){
    const iv=int7(),r0=36+S.root+iv[d-1],th=(iv[(d+1)%7]-iv[d-1]+12)%12,f5=(iv[(d+3)%7]-iv[d-1]+12)%12,nr=36+S.root+iv[S.chords[(bar+1)%4]-1];
    o.push({s:0,m:fold(r0),l:2},{s:2,m:fold(r0+th),l:2,v:.85},{s:4,m:fold(r0+f5),l:2,v:.9},{s:6,m:fold(nr-1),l:2,v:.8});
  }else if(S.bass==='alt'){o.push({s:0,m:r,l:2},{s:4,m:r+7,l:2,v:.85},{s:2,m:r,l:1,v:.5},{s:6,m:r+7,l:1,v:.5})}
  else if(S.bass==='eighth'){for(let s=0;s<8;s++)o.push({s,m:r+(s%2?12:0),l:1,v:s%4===0?1:(s%2?.6:.8)})}
  return o;
}
let evDirty=true,evMap={};
function melEvents(){
  const rows=rowSemis(),ev=[];
  for(let r=0;r<rows.length;r++){let s=0;const a=S.mel[r]||[];while(s<N){if(a[s]){let e=s;while(e<N&&a[e])e++;ev.push({step:s,len:e-s,midi:60+S.root+rows[r]});s=e}else s++}}
  return ev;
}
function melAt(step){if(evDirty){evMap={};melEvents().forEach(n=>{(evMap[n.step]=evMap[n.step]||[]).push(n)});evDirty=false}return evMap[step]||[]}

/* ===== 声音 ===== */
const NB=new WeakMap();
function noise(ctx){let b=NB.get(ctx);if(!b){b=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);const d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;NB.set(ctx,b)}return b}
function irBuf(ctx){const sr=ctx.sampleRate,len=Math.floor(sr*1.8),bf=ctx.createBuffer(2,len,sr);for(let c=0;c<2;c++){const d=bf.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6)}return bf}
function makeMaster(ctx){const g=ctx.createGain();g.gain.value=.8;const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=9000;lp.Q.value=.5;const dry=ctx.createGain();dry.gain.value=.8;const cv=ctx.createConvolver();cv.buffer=irBuf(ctx);const wet=ctx.createGain();wet.gain.value=.22;const c=ctx.createDynamicsCompressor();g.connect(lp);lp.connect(dry);dry.connect(c);lp.connect(cv);cv.connect(wet);wet.connect(c);c.connect(ctx.destination);return g}
/* ===== 真乐器音色：从 WebAudioFont 在线音色库加载录音采样；联不上网就自动用下面的合成音色 ===== */
let USE_REAL=true;
const SF={player:null,presets:{},loading:{},dead:false};
const SF_FONTS=['FluidR3_GM_sf2_file','GeneralUserGS_sf2_file','JCLive_sf2_file'];
const SF_BASES=['https://surikov.github.io/webaudiofontdata/sound/','https://cdn.jsdelivr.net/gh/surikov/webaudiofontdata@master/sound/'];
const SF_LIBS=['https://surikov.github.io/webaudiofont/npm/dist/WebAudioFontPlayer.js','https://cdn.jsdelivr.net/gh/surikov/webaudiofont@master/npm/dist/WebAudioFontPlayer.js'];
const PROG={pluck:107,flute:73,piano:0,synth:81,violin:40,erhu:110,panpipe:75,sax:65,strings:48,nylon:24,steel:25,bassf:33,bassa:32,harp:46,epiano:4,eguitar:29};
const TRIM={pluck:1,flute:.9,violin:.8,erhu:.8,panpipe:.9,sax:.8,piano:1,synth:.7,strings:.5,nylon:.6,steel:.5,bassf:1,bassa:1,harp:.7,epiano:.6,eguitar:.75};
function sfScript(url,ms){return new Promise(res=>{let done=false;const el=document.createElement('script');const fin=ok=>{if(done)return;done=true;clearTimeout(tm);if(!ok)try{el.remove()}catch(e){}res(ok)};const tm=setTimeout(()=>fin(false),ms);el.onload=()=>fin(true);el.onerror=()=>fin(false);el.async=true;el.src=url;document.head.appendChild(el)})}
async function sfGetPlayer(){
  if(SF.player)return SF.player;
  if(SF.dead)return null;
  if(!window.WebAudioFontPlayer){for(const u of SF_LIBS){if(await sfScript(u,15000)&&window.WebAudioFontPlayer)break}}
  if(window.WebAudioFontPlayer){SF.player=new window.WebAudioFontPlayer();return SF.player}
  SF.dead=true;return null;
}
const sfWait=(pre,ms)=>new Promise(res=>{const t0=Date.now();(function chk(){const ok=pre&&pre.zones&&pre.zones.length&&pre.zones.every(z=>z.buffer);if(ok)res(true);else if(Date.now()-t0>ms)res(false);else setTimeout(chk,120)})()});
function sfNames(key){
  const o=[];
  if(key[0]==='t'){const c=String(+key.slice(1)).padStart(3,'0')+'0';SF_FONTS.forEach(f=>o.push([c+'_'+f+'.js','_tone_'+c+'_'+f]))}
  else{const n=+key.slice(1);SF_FONTS.forEach(f=>o.push(['128'+n+'_0_'+f+'.js','_drum_'+n+'_0_'+f]))}
  return o;
}
function sfLoad(key){
  if(SF.presets[key]!==undefined)return Promise.resolve(SF.presets[key]);
  if(SF.loading[key])return SF.loading[key];
  return SF.loading[key]=(async()=>{
    let got=false;
    try{
      const pl=await sfGetPlayer();
      if(pl&&AC){
        outer:for(const [file,vn] of sfNames(key)){
          for(const b of SF_BASES){
            if(!window[vn]&&!(await sfScript(b+file,key[0]==='t'?30000:15000)))continue;
            const pre=window[vn];if(!pre)continue;
            try{if(pl.adjustPreset)pl.adjustPreset(AC,pre);else if(pl.loader&&pl.loader.decodeAfterLoading)pl.loader.decodeAfterLoading(AC,vn)}catch(e){}
            if(await sfWait(pre,25000)){SF.presets[key]=pre;got=true;break outer}
          }
        }
      }
    }catch(e){}
    if(!got)SF.presets[key]=false;
    return SF.presets[key];
  })();
}
const DRUM_KEYS=[36,38,37,42,46,51,49,48,45,41];
function keysFor(states){
  const ks=new Set();
  states.forEach(o=>{
    if(o.inst&&PROG[o.inst]!==undefined)ks.add('t'+PROG[o.inst]);
    if(o.pad)ks.add('t'+PROG.strings);
    if(o.bass&&o.bass!=='none')ks.add('t'+(o.bass==='walk'?PROG.bassa:PROG.bassf));
    if(o.strum)ks.add('t'+PROG.steel);
    if(o.comp)ks.add('t'+PROG.piano);
    if(o.arp&&PROG[o.arp]!==undefined)ks.add('t'+PROG[o.arp]);
  });
  DRUM_KEYS.forEach(n=>ks.add('d'+n));
  return [...ks];
}
const curStates=()=>[{inst:S.inst,pad:S.pad,bass:S.bass,strum:S.strum,comp:S.comp,arp:S.arp}];
async function sfEnsure(states){
  if(!USE_REAL||!AC)return;
  const keys=keysFor(states),need=keys.filter(k=>SF.presets[k]===undefined);
  if(!need.length)return;
  setMsg('sfload');
  await Promise.race([Promise.all(need.map(sfLoad)),new Promise(r=>setTimeout(r,45000))]);
  const ok=keys.filter(k=>SF.presets[k]).length;
  setMsg(ok===keys.length?'sfok':(ok?'sfpart':'sffail'));
}
function sfNote(ctx,dest,key,t,midi,dur,vol){
  const p=USE_REAL&&SF.presets[key];if(!p||!SF.player)return false;
  try{return !!SF.player.queueWaveTable(ctx,dest,p,t,midi,Math.max(.08,dur),vol)}catch(e){return false}
}
function lead(ctx,dest,t,m,dur,inst){
  if(PROG[inst]!==undefined&&SF.presets['t'+PROG[inst]]&&sfNote(ctx,dest,'t'+PROG[inst],t,m,dur,TRIM[inst]||1))return;
  const f=hz(m),g=ctx.createGain();g.connect(dest);
  const osc=(type,fr,vol)=>{const o=ctx.createOscillator();o.type=type;o.frequency.setValueAtTime(fr,t);const gg=ctx.createGain();gg.gain.value=vol;o.connect(gg);gg.connect(g);return o};
  let end,os;
  if(inst==='flute'){

let MOODOPT=null;
function moodCompose(text){
  const sc=[];
  for(const k in MOODS){const m=text.match(MOODS[k].re);if(m)sc.push([k,m.length])}
  sc.sort((a,b)=>b[1]-a[1]);
  const key=sc.length?sc[0][0]:'calm',P=MOODS[key];
  S.scale=P.scale;S.bpm=P.bpm;S.inst=P.inst;S.bass=P.bass;S.pad=P.pad;S.strum=false;S.swing=false;S.seventh=false;S.comp=false;S.arp=P.arp||null;S.crash=false;
  for(const [re,i] of INST_WORDS)if(re.test(text)){S.inst=i;break}
  // 秋天+思念同时出现：更慢、更疏
  if(sc.length>1&&(key==='grief'||key==='autumn')){S.bpm=Math.max(60,S.bpm-4)}
  const prog=pick(P.prog);S.chords=prog.slice();
  setDrums(DR[P.drum],!!P.fill);
  MOODOPT={sparse:P.sparse||0,desc:!!P.desc};
  genMelody(prog,P.bpm<90?'sad':'pop');MOODOPT=null;
  evDirty=true;syncUI();buildGrid();
  return {key,name:P.n,found:sc.length>0,P};
}
function autoCompose(){
  const st=$('style').value,P=STY[st];
  if(P){S.scale=P.scale;S.bpm=P.bpm;S.inst=P.inst;S.bass=P.bass;S.pad=P.pad;S.strum=!!P.strum;S.swing=!!P.swing;S.seventh=!!P.seventh;S.comp=!!P.comp;S.arp=P.arp||null}
  S.crash=false;
  const prog=pick(P?P.prog:(int7()===MAJ?PROG_MAJ:PROG_MIN));
  S.chords=prog.slice();
  setDrums(P?DR[P.drum]:DR.pop,P?P.fill:true);
  genMelody(prog,st);
  evDirty=true;syncUI();buildGrid();

}

  const sparse=P.sparse||0,desc=!!P.desc,slow=S.bpm<90,hasDr=P.drum!=='none';
  const n=rowSemis().length;

  const clip=(m,f,t2)=>{const o=zeros(n);for(let r=0;r<n;r++)for(let t=f;t<t2;t++)o[r][t]=m[r][t];return o};
  const A=gen(pA,.3),A2=splice(A,gen(pA,.3),16);

  const C=gen(brP,.5),C2=splice(C,gen(brP,.5),16);
  const intro=clip(A,16,32);
  const outro=clip(A,0,16);const tr=nearestChordRow(Math.floor(n*.3),[0]);for(let t=24;t<32;t++)outro[tr][t]=1;
  const dr=(lvl,fill)=>hasDr?mkDrum(DR[P.drum],lvl,fill):mkDrum(DR.none,0,false);
  const chBass=base.bass==='none'?'root':base.bass;
  const blocks=[];let secId=0;
  const add=(key,list)=>{secId++;list.forEach(o=>blocks.push(Object.assign({root:base.root,inst:base.inst,bass:base.bass,pad:base.pad,strum:base.strum,comp:base.comp,arp:base.arp,crash:false,v0:1,v1:1,tm0:1,tm1:1,sec:key,secId},o)))};
  const verse=sw=>add('verse',[{mel:sw?A2:A,chords:pA,drum:dr(1),v0:.7,v1:.72},{mel:sw?A:A2,chords:pA,drum:dr(1,hasDr),v0:.72,v1:.76}]);

  add('intro',[{mel:intro,chords:pA,drum:dr(0),bass:'none',strum:false,comp:false,v0:.5,v1:.8}]);
  verse(false);chorus('chorus',base.root);
  for(let i=0;i<pairs;i++){verse(i%2===0);chorus('chorus',base.root)}
  verse(true);chorus('chorus',base.root);
  const alt=base.inst==='piano'?'flute':'piano';
  add('bridge',[{mel:C,chords:brP,drum:dr(0),bass:'none',strum:false,comp:false,inst:alt,v0:.5,v1:.7},{mel:C2,chords:brP,drum:dr(0),bass:'none',strum:false,comp:false,inst:alt,v0:.7,v1:.95}]);
  {const SOLO=($('soloInst')&&$('soloInst').value)||'eguitar';const S1=gen(pB,.6),S2=splice(S1,gen(pB,.78),16);
   add('solo',[{mel:S1,chords:pB,drum:dr(2,false),bass:chBass,strum:false,comp:false,inst:SOLO,v0:.85,v1:.95},{mel:S2,chords:pB,drum:dr(2,hasDr),bass:chBass,strum:false,comp:false,inst:SOLO,crash:hasDr,v0:.95,v1:1}])}
  chorus('final',base.root+2);
  add('outro',[{mel:outro,chords:[pA[0],pA[1],pA[2],1],drum:dr(0),bass:'none',strum:false,comp:false,v0:.85,v1:.4,tm0:1,tm1:1.35}]);
  restore(keep);
  // 段落时间表
  let t=0;const map=[];let last=-1;
  blocks.forEach(b=>{if(b.secId!==last){map.push({t,sec:b.sec});last=b.secId}
    for(let s=0;s<N;s++)t+=60/S.bpm/2*(b.tm0+(b.tm1-b.tm0)*s/N)});
  return {blocks,map,total:t};
}
const fmtT=x=>Math.floor(x/60)+':'+String(Math.floor(x%60)).padStart(2,'0');

  el.textContent=X('全曲约 ','Length about ')+fmtT(SONG.total)+X('　','  ')+SONG.map.map(m=>fmtT(m.t)+' '+X(SECN[m.sec][0],SECN[m.sec][1])).join(' · ');

function changeScale(ns){
  const oldRows=rowSemis(),old=S.mel;S.scale=ns;
  const nr=rowSemis();S.mel=zeros(nr.length);
  old.forEach((a,r)=>a.forEach((v,s)=>{if(v){let bj=0,bd=99;nr.forEach((x,j)=>{const d=Math.abs(x-oldRows[r]);if(d<bd){bd=d;bj=j}});S.mel[bj][s]=1}}));

function vlq(n){const b=[n&127];while(n>>=7)b.unshift((n&127)|128);return b}
function midiBytes(blocks){
  const sn=snap(),list=blocks||[null];
  const tpq=480,st=tpq/2,ev=[];let o=0;
  const add=(t,b)=>ev.push({t,b,o:o++});
  const PR={eguitar:29,pluck:107,flute:73,piano:0,synth:81,violin:40,erhu:110,panpipe:75,sax:65};
  add(0,[0xC1,48]);add(0,[0xC2,33]);add(0,[0xC3,25]);add(0,[0xC4,0]);add(0,[0xC5,24]);
  const note=(ch,m,t0,t1,v)=>{add(t0,[0x90|ch,m,v]);add(t1,[0x80|ch,m,0])};
  list.forEach((blk,bi)=>{
    if(blk)applyBlock(blk);
    const off=bi*N*st,vs=blk?Math.min(1,(blk.v0+blk.v1)/2):1,V=x=>Math.max(1,Math.min(127,Math.round(x*vs)));
    const tickOf=n=>off+n*st+((S.swing&&n%2)?Math.round(st/3):0);
    const us=Math.round(60000000/(S.bpm/(blk?blk.tm0:1)));
    add(off,[0xFF,0x51,3,(us>>16)&255,(us>>8)&255,us&255]);
    add(off,[0xC0,PR[S.inst]]);add(off,[0xC2,S.bass==='walk'?32:33]);if(S.arp)add(off,[0xC5,S.arp==='harp'?46:24]);
    melEvents().forEach(n=>note(0,n.midi,tickOf(n.step),tickOf(n.step+n.len),V(90)));
    for(let b=0;b<4;b++){
      if(S.pad)chordMidis(S.chords[b]).forEach(m=>note(1,m,off+b*8*st,off+(b*8+8)*st,V(55)));
      bassHits(b).forEach(h=>note(2,h.m,tickOf(b*8+h.s),tickOf(b*8+h.s+h.l),V(90)));

    }

    S.drum.s.forEach((v,x)=>{if(v)note(9,v===2?(x%8>=7?41:(x%8===6?45:48)):(v===3?37:38),tickOf(x),tickOf(x)+st/2,V(100))});

}
function wavBytes(buf){

  S.root=clamp(+o.r||0,0,11);S.scale=o.sc;S.bpm=clamp(+o.b||110,60,180);S.inst=['pluck','flute','piano','synth','violin','erhu','panpipe','sax','eguitar'].includes(o.i)?o.i:'pluck';

function fillSel(sel,list,lab){const cur=sel.value;sel.innerHTML='';list.forEach(it=>{const o=document.createElement('option');o.value=it[0];o.textContent=lab(it);sel.appendChild(o)});if(cur&&[...sel.options].some(o=>o.value===cur))sel.value=cur}
function fillAll(){
  fillSel($('style'),[['pop','流行','Pop'],['sad','忧伤','Sad'],['happy','欢快','Happy'],['guofeng','古风','Chinese classical'],['country','乡村','Country'],['jazz','爵士','Jazz'],['free','自由（保持当前设置）','Free (keep my settings)']],x=>X(x[1],x[2]));
  fillSel($('root'),NOTE.map((n,i)=>[String(i),n]),x=>x[1]);
  fillSel($('scale'),[['major','大调','Major'],['minor','小调','Minor'],['pentMaj','五声音阶 · 宫调','Pentatonic (major)'],['pentMin','五声音阶 · 羽调','Pentatonic (minor)'],['blues','蓝调音阶','Blues']],x=>X(x[1],x[2]));
  fillSel($('inst'),[['pluck','古筝（拨弦）','Plucked string (guzheng-like)'],['flute','笛子','Flute'],['violin','小提琴','Violin'],['erhu','二胡','Erhu'],['panpipe','排箫','Panpipes'],['sax','萨克斯','Saxophone'],['piano','钢琴','Piano'],['eguitar','电吉他','Electric guitar'],['synth','合成器','Synth']],x=>X(x[1],x[2]));
  fillSel($('bass'),[['none','无','None'],['root','根音','Root notes'],['alt','根音与五音交替（乡村）','Root-fifth alternating (country)'],['walk','行走低音（爵士）','Walking bass (jazz)'],['eighth','八分音符跳动','Eighth-note bounce']],x=>X(x[1],x[2]));
}
function syncUI(){
  $('root').value=String(S.root);$('scale').value=S.scale;$('inst').value=S.inst;$('bass').value=S.bass;
  $('bpm').value=S.bpm;$('bpmv').textContent=S.bpm;$('pad').checked=S.pad;$('strum').checked=S.strum;$('comp').checked=S.comp;$('swing').checked=S.swing;$('seventh').checked=S.seventh;
}
let cols=[];
function buildGrid(){
  cols=Array.from({length:N},()=>[]);
  const rows=rowSemis(),roll=$('roll'),dr=$('drums'),ch=$('chords');
  roll.innerHTML='';dr.innerHTML='';ch.innerHTML='';
  const cell=(kind,r,s,on)=>{const d=document.createElement('div');d.className='c'+(s%8===0?' bar':'')+(on?' on':'');d.dataset.k=kind;d.dataset.r=r;d.dataset.s=s;cols[s].push(d);return d};
  for(let r=rows.length-1;r>=0;r--){
    const l=document.createElement('div');l.className='lab'+(rows[r]%12===0?' root':'');l.textContent=noteName(60+S.root+rows[r]);roll.appendChild(l);
    for(let s=0;s<N;s++)roll.appendChild(cell('m',r,s,S.mel[r][s]));
  }
  [['k','底鼓','Kick'],['s','军鼓','Snare'],['h','踩镲','Hi-hat']].forEach(([k,zh,en])=>{
    const l=document.createElement('div');l.className='lab';l.dataset.zh=zh;l.dataset.en=en;l.textContent=X(zh,en);dr.appendChild(l);
    for(let s=0;s<N;s++)dr.appendChild(cell(k,0,s,S.drum[k][s]));
  });
  const l=document.createElement('div');l.className='lab';ch.appendChild(l);
  const rom=int7()===MAJ?ROMAN_MAJ:ROMAN_MIN;
  for(let b=0;b<4;b++){
    const w=document.createElement('div');w.className='cc';const sel=document.createElement('select');sel.setAttribute('aria-label',X('第 '+(b+1)+' 小节和弦','Chord for bar '+(b+1)));
    for(let d=1;d<=7;d++){const o=document.createElement('option');o.value=d;o.textContent=rom[d-1]+' · '+chordName(d);sel.appendChild(o)}
    sel.value=S.chords[b];sel.onchange=()=>{S.chords[b]=+sel.value};w.appendChild(sel);ch.appendChild(w);
  }
}
function setCell(c,v){
  const k=c.dataset.k,r=+c.dataset.r,s=+c.dataset.s;
  if(k==='m')S.mel[r][s]=v?1:0;else S.drum[k][s]=v?1:0;
  c.classList.toggle('on',!!v);evDirty=true;
  if(v&&ensureAC()){const t=AC.currentTime;
    if(k==='m')lead(AC,master,t,60+S.root+rowSemis()[r],.3,S.inst);else if(k==='k')kick(AC,master,t);else if(k==='s')snare(AC,master,t);else hat(AC,master,t,S.swing)}
}
let paint=null;
function cellAt(x,y){const e=document.elementFromPoint(x,y);return e&&e.closest&&e.closest('.c')}
[$('roll'),$('drums')].forEach(g=>g.addEventListener('pointerdown',e=>{
  const c=e.target.closest('.c');if(!c)return;e.preventDefault();
  const on=c.classList.contains('on');paint={v:!on,k:c.dataset.k};setCell(c,!on);
}));
window.addEventListener('pointermove',e=>{if(!paint)return;const c=cellAt(e.clientX,e.clientY);if(c&&c.dataset.k===paint.k&&c.classList.contains('on')!==paint.v)setCell(c,paint.v)});
window.addEventListener('pointerup',()=>{paint=null});
window.addEventListener('pointercancel',()=>{paint=null});

/* 播放 */
let playing=false,timer=null,nextT=0,cur=0,visQ=[],bus=null,raf=0,phStep=-1;
function setPH(s){if(phStep>=0)cols[phStep].forEach(c=>c.classList.remove('ph'));phStep=s;if(s>=0)cols[s].forEach(c=>c.classList.add('ph'))}
function setPlayBtn(){$('play').textContent=playing?X('停止','Stop'):X('播放','Play');$('songPlay').textContent=playing?X('停止','Stop'):X('播放整曲','Play song')}
function beginBlock(b,t){
  applyBlock(b);buildGrid();syncUI();
  const sd0=60/S.bpm/2*b.tm0;
  secBus=AC.createGain();secBus.gain.setValueAtTime(b.v0,t);secBus.gain.linearRampToValueAtTime(b.v1,t+N*sd0);secBus.connect(bus);
  $('songNow').textContent=X('正在播放：','Now playing: ')+X(SECN[b.sec][0],SECN[b.sec][1]);
}
function sched(){
  if(SONGON&&SONG.bi>=SONG.blocks.length&&cur===0&&AC.currentTime>nextT+2.5){stop();return}
  while(nextT<AC.currentTime+.12){
    if(SONGON){
      if(cur===0){if(SONG.bi>=SONG.blocks.length)break;SONG.cb=SONG.blocks[SONG.bi++];beginBlock(SONG.cb,nextT)}
      TM=SONG.cb.tm0+(SONG.cb.tm1-SONG.cb.tm0)*cur/N;
    }
    const sd=stepDur();playStep(AC,SONGON?secBus:bus,cur,nextT);visQ.push({s:cur,t:nextT});cur=(cur+1)%N;nextT+=sd}
}
function vis(){if(!playing)return;while(visQ.length&&visQ[0].t<=AC.currentTime)setPH(visQ.shift().s);raf=requestAnimationFrame(vis)}
let starting=false;
async function play(song){
  if(starting)return;
  if(!ensureAC()){setMsg('noaudio');return}
  if(playing)return;
  try{sfEnsure(song&&SONG?SONG.blocks:curStates()).catch(()=>{})}catch(e){}
  SONGON=!!(song&&SONG);if(SONGON){SONG.bi=0;SNAP=snap()}
  bus=AC.createGain();bus.connect(master);playing=true;cur=0;TM=1;nextT=AC.currentTime+.08;visQ=[];
  timer=setInterval(sched,25);raf=requestAnimationFrame(vis);setPlayBtn();
}
function stop(){
  clearInterval(timer);playing=false;cancelAnimationFrame(raf);
  if(bus){const b=bus;b.gain.setTargetAtTime(0,AC.currentTime,.03);setTimeout(()=>{try{b.disconnect()}catch(e){}},400);bus=null}
  if(SONGON){SONGON=false;if(SNAP){restore(SNAP);SNAP=null;syncUI();buildGrid()}$('songNow').textContent=''}
  TM=1;setPH(-1);setPlayBtn();
}
const hasNotes=()=>melEvents().length>0||S.drum.k.some(Boolean)||S.drum.s.some(Boolean);

$('play').onclick=()=>{playing?stop():play()};
let moodRes=null;
function showMood(){$('moodMsg').textContent=moodRes?(moodRes.found?X('听出的心情：','Feeling: ')+X(moodRes.name[0],moodRes.name[1]):X('没读出明显的情绪，用了宁静的风格。可以多写几句。','No clear feeling found, so I used a calm style. Try writing a bit more.')):''}
$('moodGo').onclick=()=>{const t=$('mood').value.trim();if(!t){$('moodMsg').textContent=X('先写几句话。','Write a few words first.');return}moodRes=moodCompose(t);showMood();setMsg(null);if(!playing)play()};
$('songGo').onclick=songGo;
$('songPlay').onclick=()=>{if(playing){stop();return}if(!SONG){songGo();return}play(true)};
$('songWav').onclick=async()=>{if(!SONG){setMsg('nosong');return}setMsg('busy');$('songWav').disabled=true;try{download(await renderSongWav(),'song.wav','audio/wav');setMsg('done')}catch(e){setMsg('fail')}$('songWav').disabled=false};
$('songMidi').onclick=()=>{if(!SONG){setMsg('nosong');return}download(midiBytes(SONG.blocks),'song.mid','audio/midi');setMsg('done')};
$('auto').onclick=()=>{autoCompose();setMsg(null);if(!playing)play()};
$('clear').onclick=()=>{S.mel=zeros(rowSemis().length);evDirty=true;buildGrid()};
$('root').onchange=e=>{S.root=+e.target.value;evDirty=true;buildGrid()};
$('scale').onchange=e=>changeScale(e.target.value);
$('inst').onchange=e=>{S.inst=e.target.value;if(ensureAC())sfEnsure(curStates())};
$('bass').onchange=e=>{S.bass=e.target.value};
$('pad').onchange=e=>{S.pad=e.target.checked};
$('strum').onchange=e=>{S.strum=e.target.checked};
$('comp').onchange=e=>{S.comp=e.target.checked};
$('swing').onchange=e=>{S.swing=e.target.checked};
$('real').onchange=e=>{USE_REAL=e.target.checked;if(USE_REAL&&ensureAC())sfEnsure(curStates());else if(!USE_REAL)setMsg(null)};
window.addEventListener('pointerdown',()=>{if(ensureAC())sfEnsure(curStates())},{once:true});
$('seventh').onchange=e=>{S.seventh=e.target.checked;buildGrid()};
$('bpm').oninput=e=>{S.bpm=+e.target.value;$('bpmv').textContent=S.bpm};
$('midi').onclick=()=>{if(!hasNotes()){setMsg('empty');return}download(midiBytes(),'music.mid','audio/midi');setMsg('done')};
$('wav').onclick=async()=>{
  if(!hasNotes()){setMsg('empty');return}
  setMsg('busy');$('wav').disabled=true;
  try{download(await renderWav(2),'music.wav','audio/wav');setMsg('done')}catch(e){setMsg('fail')}
  $('wav').disabled=false;
};
$('link').onclick=async()=>{
  const u=location.href.split('#')[0]+'#s='+b64(JSON.stringify(pack()));
  try{await navigator.clipboard.writeText(u);setMsg('link')}catch(e){setMsg('linkno')}
  try{history.replaceState(null,'','#s='+b64(JSON.stringify(pack())))}catch(e){}
};
$('save').onclick=()=>{try{localStorage.setItem('music_project_v1',JSON.stringify(pack()));setMsg('saved')}catch(e){setMsg('fail')}};
$('load').onclick=()=>{
  let o=null;try{o=JSON.parse(localStorage.getItem('music_project_v1'))}catch(e){}
  if(o&&unpack(o)){syncUI();buildGrid();setMsg('loaded')}else setMsg('none');
};
window.addEventListener('keydown',e=>{if(e.code==='Space'&&!/^(INPUT|SELECT|TEXTAREA|BUTTON)$/.test(document.activeElement.tagName)){e.preventDefault();playing?stop():play()}});

/* 语言切换 */
function applyStatic(){
  document.documentElement.lang=EN()?'en':'zh-CN';
  document.querySelectorAll('[data-en]').forEach(e=>{
    if(e.dataset.zh===undefined)e.dataset.zh=e.innerHTML;
    e.innerHTML=EN()?e.dataset.en:e.dataset.zh;
  });
  document.title=X('音乐编曲坊','Music Composer');
  document.querySelectorAll('.lab[data-en]').forEach(l=>{l.textContent=X(l.dataset.zh,l.dataset.en)});
  fillAll();syncUI();setPlayBtn();setMsg(msgK);if(typeof showMood==='function'&&moodRes)showMood();if(typeof showSongMap==='function')showSongMap();
  $('chords').querySelectorAll('select').forEach((s,i)=>s.setAttribute('aria-label',X('第 '+(i+1)+' 小节和弦','Chord for bar '+(i+1))));
}
function setLang(v){LANG=v;try{localStorage.setItem('lang',v)}catch(e){}applyStatic()}
$('lang').addEventListener('click',()=>setLang(EN()?'zh':'en'));
window.addEventListener('storage',e=>{if(e.key==='lang'){const v=(e.newValue&&/^en/i.test(e.newValue))?'en':'zh';if(v!==LANG){LANG=v;applyStatic()}}});

/* 启动：有分享链接就读它，否则先放一首自动生成的 */
(function init(){
  let ok=false;
  fillAll();
  try{const m=/#s=([\w-]+)/.exec(location.hash);if(m)ok=unpack(JSON.parse(unb64(m[1])))}catch(e){}
  if(!ok){$('style').value='guofeng';autoCompose()}
  syncUI();buildGrid();applyStatic();
})();
</script>
