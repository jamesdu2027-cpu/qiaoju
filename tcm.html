<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>中医养生</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;900&display=swap">
<style>
:root {
  color-scheme: light;
  --bg: #EDF2F0;
  --surface: #FAFCFB;
  --ink: #14262B;
  --muted: #587073;
  --line: #CCD9D6;
  --accent: #0D5C63;
  --accent-soft: #DCEEEC;
  --warn: #8F6410;
  --warn-soft: #F3E9D2;
  --bad: #A83A2C;
  --f-head: 'Noto Serif SC', 'Songti SC', 'STSong', 'SimSun', serif;
  --f-body: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E191B; --surface: #152326; --ink: #E3EDEB; --muted: #92A6A8; --line: #28393C;
    --accent: #5CC3C9; --accent-soft: #19393C; --warn: #DDB660; --warn-soft: #3A3119; --bad: #EA8573;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E191B; --surface: #152326; --ink: #E3EDEB; --muted: #92A6A8; --line: #28393C;
  --accent: #5CC3C9; --accent-soft: #19393C; --warn: #DDB660; --warn-soft: #3A3119; --bad: #EA8573;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font: 14px var(--f-body); line-height: 1.7; }
.wrap {
  max-width: 720px; margin: 0 auto; padding-block: 28px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.eyebrow { margin: 0; font-size: 13px; letter-spacing: .2em; color: var(--muted); }
h1 { margin: 2px 0 6px; font-family: var(--f-head); font-weight: 900; font-size: clamp(38px, 11vw, 60px); line-height: 1.15; letter-spacing: .08em; text-wrap: balance; }
.lede { margin: 0 0 20px; color: var(--muted); max-width: 32em; }
h2 { margin: 30px 0 10px; font-family: var(--f-head); font-weight: 900; font-size: 20px; letter-spacing: .06em; text-wrap: balance; }
.search { display: flex; gap: 8px; }
.search input { flex: 1 1 auto; min-width: 0; font: inherit; font-size: 17px; color: var(--ink); background: var(--surface); border: 1.5px solid var(--accent); border-radius: 4px; padding: 12px 12px; }
.search button, .chip, .ex { font: inherit; cursor: pointer; border-radius: 4px; }
.search button { flex: 0 0 auto; color: var(--bg); background: var(--accent); border: 1.5px solid var(--accent); padding: 0 18px; font-weight: 700; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.hint { margin: 8px 0 0; font-size: 13px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 0; padding: 0; list-style: none; }
.chip { color: var(--ink); background: var(--surface); border: 1px solid var(--line); padding: 5px 12px; }
.chip[aria-pressed="true"] { color: var(--accent); background: var(--accent-soft); border-color: var(--accent); font-weight: 700; }
.ex { color: var(--accent); background: none; border: 1px dashed var(--accent); padding: 4px 10px; font-size: 14px; text-align: left; }
.unk { margin: 10px 0 0; font-size: 14px; color: var(--warn); }
.card { margin: 0 0 12px; padding: 14px 14px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; }
.card.hit { border-color: var(--accent); }
.card header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.card h3 { margin: 0; font-family: var(--f-head); font-weight: 900; font-size: 24px; letter-spacing: .06em; }
.pill { font-size: 13px; font-weight: 700; padding: 0 8px; border-radius: 2px; color: var(--accent); background: var(--accent-soft); }
.pill.part { color: var(--warn); background: var(--warn-soft); }
.card dl { display: grid; grid-template-columns: 4.5em 1fr; gap: 4px 10px; margin: 10px 0 0; }
.card dt { font-size: 13px; color: var(--muted); letter-spacing: .1em; padding-top: 2px; }
.card dd { margin: 0; min-width: 0; }
.ok { color: var(--accent); font-weight: 500; }
.miss { color: var(--muted); }
.no { color: var(--bad); font-weight: 500; }
.empty { padding: 18px 14px; border: 1px dashed var(--line); border-radius: 4px; color: var(--muted); }
.safe { margin-top: 36px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); max-width: 40em; }
.safe b { color: var(--ink); }
.exs { display: flex; flex-wrap: wrap; gap: 8px; }

/* 语言切换 */
.langbtn { position: fixed; right: max(12px, env(safe-area-inset-right, 0px)); bottom: max(12px, env(safe-area-inset-bottom, 0px)); z-index: 10; font: inherit; cursor: pointer; border-radius: 16px; padding: 6px 12px; font-size: 13px; font-weight: 700; color: var(--bg); background: var(--accent); border: 1px solid var(--accent); }

/* English layout adjustments */
html[lang="en"] body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; line-height: 1.6; }
html[lang="en"] h1, html[lang="en"] h2, html[lang="en"] .card h3 { font-family: Georgia, 'Times New Roman', serif; letter-spacing: 0; }
html[lang="en"] h1 { font-weight: 700; }
html[lang="en"] .card h3 { font-size: 21px; }
html[lang="en"] .eyebrow, html[lang="en"] .card dt { letter-spacing: .03em; }
html[lang="en"] .card dl { grid-template-columns: 8.4em 1fr; }
</style>
</head>
<body>
<button type="button" id="lang" class="langbtn" aria-label="Language / 语言">中 / EN</button>

<main class="wrap">
  <header>
    <p class="eyebrow" data-en="Pattern differentiation reference · Symptom search">辨证参考 · 症状搜索</p>
    <h1 data-en="TCM Wellness">中医养生</h1>
    <p class="lede" data-en="Type your symptoms in the search box, separated by commas, and the matching patterns, treatment principles and differentiation points are listed below.">把症状写进搜索栏，用逗号或空格隔开，下面会列出相符的证型、治法和鉴别要点。</p>
  </header>

  <form class="search" id="form" role="search">
    <input id="q" type="search" autocomplete="off" placeholder="例如：五心烦热，盗汗，腰膝酸软" aria-label="症状" value="五心烦热，盗汗，腰膝酸软">
    <button type="submit" data-en="Match">辨证</button>
  </form>
  <p class="hint" data-en="The box holds example symptoms; replace them with the ones you want to look up. You can also tap the symptom tags below.">输入框里现在是示例症状，改成你要查的就行。点下面的症状词也可以。</p>
  <ul class="chips" id="chips"></ul>
  <p class="unk" id="unk" hidden></p>

  <h2 data-en="Matching patterns">相符的证型</h2>
  <div id="out"></div>

  <h2 data-en="Try these groups">试试这几组</h2>
  <p style="margin:0 0 8px;color:var(--muted);font-size:14px" data-en="The symptoms are similar, but one more or one fewer changes the conclusion.">症状相近，多一个或少一个，结论就不同。</p>
  <div class="exs">
    <button class="ex" type="button" data-q="五心烦热，盗汗，腰膝酸软"></button>
    <button class="ex" type="button" data-q="五心烦热，盗汗，咳嗽，吐痰"></button>
    <button class="ex" type="button" data-q="有气无力，声音低微"></button>
    <button class="ex" type="button" data-q="有气无力，声音低微，咳嗽"></button>
    <button class="ex" type="button" data-q="有气无力，声音低微，腰膝酸软"></button>
    <button class="ex" type="button" data-q="有气无力，声音低微，咳嗽，腰膝酸软"></button>
    <button class="ex" type="button" data-q="心悸，失眠，健忘，面色无华"></button>
    <button class="ex" type="button" data-q="心悸，失眠，五心烦热，盗汗"></button>
    <button class="ex" type="button" data-q="情志抑郁，胁肋胀痛，善太息"></button>
    <button class="ex" type="button" data-q="头痛，目赤，急躁易怒，口苦"></button>
    <button class="ex" type="button" data-q="食欲不振，腹胀，大便稀溏，有气无力"></button>
    <button class="ex" type="button" data-q="食欲不振，大便稀溏，腹部冷痛，畏寒肢冷"></button>
  </div>

  <p class="safe" data-en="<b>Please note:</b> This is only a pattern-differentiation reference based on symptoms and cannot replace seeing a doctor. Proper differentiation combines all four diagnostic methods, and tongue and pulse matter just as much. A cough lasting more than two weeks together with night sweats, afternoon low fever, weight loss or coughing blood needs a hospital visit first to rule out tuberculosis; long-term frequent or urgent urination or blood in the urine also needs checking. For chest pain, difficulty breathing or a persistent high fever, seek medical care promptly. If you already take medicine for a chronic condition, do not stop or change it on your own."><b>请注意：</b>这里只是按症状给出的辨证参考，不能代替医生面诊。辨证要四诊合参，舌象和脉象同样重要。咳嗽超过两周，并伴有盗汗、午后低热、消瘦或咯血时，要先去医院排除肺结核；长期尿频、尿急或血尿，也要去检查。出现胸痛、呼吸困难、持续高热时，请尽快就医。已经在服药的慢性病患者，不要自行停药或换药。</p>
</main>

<script>

  var LANG = "zh";

    var qm = /[?&]lang=([\w-]+)/.exec(location.search);

  var SYM_BY = {};
  SYMPTOMS.forEach(function (s) { SYM_BY[s.name] = s; });
  function SN(zh) { return EN() ? SYM_BY[zh].en : zh; }
  function sep() { return EN() ? ", " : "，"; }

  function names() { return SYMPTOMS.map(function (s) { return s.name; }); }

  function parse(text) {
    var sel = {}, rest = [];
    var pieces = [];
    text.split(/[,，、;；]+/).forEach(function (p) {
      if (/[一-鿿]/.test(p)) { p.split(/\s+/).forEach(function (q) { pieces.push(q); }); } else { pieces.push(p); }
    });
    pieces.map(function (p) { return p.trim(); }).filter(Boolean).forEach(function (frag) {
      var hit = false, low = frag.toLowerCase();
      SYMPTOMS.forEach(function (s) {
        var keys = [s.name].concat(s.alias || [], [s.en], s.ealias || []);
        // skip：先把另一个症状的词（如“五心烦热”里含有“心烦”）从文字里挖掉，避免误认
        var text = low;
        (s.skip || []).forEach(function (w) { text = text.split(w).join(" "); });
        if (keys.some(function (k) { return text.indexOf(k.toLowerCase()) >= 0; })) { sel[s.name] = true; hit = true; }
      });
      if (!hit) rest.push(frag);
    });
    return { sel: sel, rest: rest };
  }

  function match(sel) {
    var out = [];
    SYNDROMES.forEach(function (sy) {
      var have = sy.must.filter(function (m) { return sel[m]; });
      var block = sy.not.filter(function (n) { return sel[n]; });
      if (!have.length) return;
      var full = have.length === sy.must.length && !block.length;
      out.push({ sy: sy, have: have, block: block, full: full, ratio: have.length / sy.must.length - (block.length ? 0.5 : 0) });
    });
    out.sort(function (a, b) { return (b.full - a.full) || (b.full ? b.sy.must.length - a.sy.must.length : b.ratio - a.ratio); });
    return out;
  }

  if (typeof document === "undefined") {
    if (typeof module !== "undefined") module.exports = { parse: parse, match: match, SYNDROMES: SYNDROMES, SYMPTOMS: SYMPTOMS };
    return;
  }

  var $ = function (id) { return document.getElementById(id); };

  // 把选中的症状按当前语言写回输入框的格式
  function ser(r) {
    return names().filter(function (x) { return r.sel[x]; }).map(SN).concat(r.rest).join(sep());
  }

  function render() {
    var r = parse($("q").value);
    $("chips").innerHTML = names().map(function (n) {
      return '<li><button type="button" class="chip" data-s="' + n + '" aria-pressed="' + (r.sel[n] ? "true" : "false") + '">' + SN(n) + '</button></li>';
    }).join("");
    var unk = $("unk");
    if (r.rest.length) {
      unk.hidden = false;
      unk.textContent = X("症状库里暂时没有：" + r.rest.join("、") + "。", "Not yet in the symptom library: " + r.rest.join(", ") + ".");
    } else { unk.hidden = true; }

    var res = match(r.sel), out = $("out");
    if (!Object.keys(r.sel).length) {
      out.innerHTML = '<div class="empty">' + X("还没有识别到症状。请在上面的搜索栏输入，或点一个症状词。", "No symptoms recognized yet. Type in the search box above, or tap a symptom tag.") + '</div>';
      return;
    }
    if (!res.length) {
      out.innerHTML = '<div class="empty">' + X("这几个症状没有对上库里的任何证型。可以再补充几个症状，或者交给医生面诊辨证。", "These symptoms did not match any pattern in the library. Add a few more symptoms, or have a doctor differentiate in person.") + '</div>';
      return;
    }
    out.innerHTML = res.map(function (m) {
      var sy = m.sy;
      var basis = sy.must.map(function (s) {
        return m.have.indexOf(s) >= 0
          ? '<span class="ok">' + SN(s) + ' ✓</span>'
          : '<span class="miss">' + SN(s) + X(" 未见", " not seen") + '</span>';
      }).join(X("　", " · "));
      var rows = '<dt>' + X("依据", "Basis") + '</dt><dd>' + basis + '</dd>';
      if (m.block.length) rows += '<dt>' + X("排除", "Exclusion") + '</dt><dd class="no">' + X(
        "出现了" + m.block.join("、") + "，不按" + sy.name + "论。",
        m.block.map(SN).join(", ") + " present, so not treated as " + sy.en + ".") + '</dd>';
      rows += '<dt>' + X("治法", "Treatment") + '</dt><dd>' + X(sy.treat, sy.treatEn) + '</dd>';
      if (sy.level) rows += '<dt>' + X("程度", "Severity") + '</dt><dd class="no">' + X(sy.level, sy.levelEn) + '</dd>';
      rows += '<dt>' + X("鉴别", "Differentiation") + '</dt><dd>' + X(sy.diff, sy.diffEn) + '</dd>';
      var status = m.block.length ? '' : (m.full ? '<span class="pill">' + X("相符", "Match") + '</span>' : '<span class="pill part">' + X("部分相符", "Partial match") + '</span>');
      return '<article class="card' + (m.full && !m.block.length ? ' hit' : '') + '"><header><h3>' + X(sy.name, sy.en) + '</h3>' + status + '</header><dl>' + rows + '</dl></article>';
    }).join("");
  }

  function setText(t) { $("q").value = t; render(); }

  /* ===== 静态文字：每个带 data-en 的元素，保存中文原文，按语言切换 ===== */
  function applyStatic() {
    document.documentElement.lang = EN() ? "en" : "zh-CN";
    var nodes = document.querySelectorAll("[data-en]");
    for (var i = 0; i < nodes.length; i++) {
      var el = nodes[i];
      if (el.getAttribute("data-zh") === null) el.setAttribute("data-zh", el.innerHTML);
      el.innerHTML = EN() ? el.getAttribute("data-en") : el.getAttribute("data-zh");
    }
    document.title = X("中医养生", "TCM Wellness");
    var q = $("q");
    q.setAttribute("placeholder", X("例如：五心烦热，盗汗，腰膝酸软", "e.g. Five-center heat, night sweats, weak and sore lower back and knees"));
    q.setAttribute("aria-label", X("症状", "Symptoms"));
    var exs = document.querySelectorAll("button.ex");
    for (var j = 0; j < exs.length; j++) exs[j].textContent = ser(parse(exs[j].getAttribute("data-q")));
  }
  // 切换语言时，输入框里的症状也换成当前语言
  function refresh() {
    applyStatic();
    setText(ser(parse($("q").value)));
  }
  function setLang(v) {
    LANG = v;
    try { localStorage.setItem("lang", v); } catch (e) { }
    refresh();
  }

  $("lang").addEventListener("click", function () { setLang(EN() ? "zh" : "en"); });
  window.addEventListener("storage", function (e) {
    if (e.key === "lang") { var v = (e.newValue && /^en/i.test(e.newValue)) ? "en" : "zh"; if (v !== LANG) { LANG = v; refresh(); } }
  });
  $("q").addEventListener("input", render);
  $("form").addEventListener("submit", function (e) { e.preventDefault(); render(); });
  $("chips").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-s]");
    if (!b) return;
    var r = parse($("q").value), n = b.getAttribute("data-s");
    if (r.sel[n]) delete r.sel[n]; else r.sel[n] = true;
    setText(ser(r));
  });
  document.addEventListener("click", function (e) {
    var b = e.target.closest("button[data-q]");
    if (b) setText(ser(parse(b.getAttribute("data-q"))));
  });
  refresh();
})();
</script>
</body>
</html>
