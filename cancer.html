function mapName(raw){

}

 en:{TP53:"Guardian of the genome: detects DNA damage and stops or removes damaged cells. When it fails, damaged cells keep growing. A tumor suppressor (brake).",TERT:"Core part of telomerase, which lets cells divide without limit. When abnormally switched on, cells do not age.",CTNNB1:"Beta-catenin, part of the Wnt growth-signal pathway. Mutations keep the growth signal switched on.",KRAS:"A switch for cell-growth signals. Mutations lock the switch in the ON position. An oncogene (accelerator).",EGFR:"A receptor on the cell surface that receives growth signals. Mutations keep the signal switched on.",VHL:"Oxygen-sensing switch. When it fails, the cell thinks it lacks oxygen and promotes blood vessel and tumor growth.",PBRM1:"A chromatin-remodeling gene that controls how DNA is packaged, affecting many other genes.",PTEN:"A tumor suppressor that brakes the PI3K growth pathway. When lost, growth signals become too strong.",PIK3CA:"Part of the cell growth and survival signaling pathway. Mutations promote cell growth.",BRAF:"A link in the growth-signal pathway. The common V600E mutation keeps it permanently active."},
 es:{TP53:"Guardián del genoma: detecta el daño en el ADN y detiene o elimina las células dañadas. Si falla, las células dañadas siguen creciendo. Es un gen supresor de tumores (freno).",TERT:"Parte central de la telomerasa, que permite a las células dividirse sin límite. Si se activa de forma anormal, las células no envejecen.",CTNNB1:"Beta-catenina, parte de la vía de señal de crecimiento Wnt. Las mutaciones dejan la señal de crecimiento siempre encendida.",KRAS:"Interruptor de las señales de crecimiento celular. Las mutaciones lo dejan fijo en encendido. Es un oncogén (acelerador).",EGFR:"Receptor en la superficie de la célula que recibe señales de crecimiento. Las mutaciones dejan la señal encendida.",VHL:"Interruptor que detecta el oxígeno. Si falla, la célula cree que le falta oxígeno y estimula el crecimiento de vasos sanguíneos y tumor.",PBRM1:"Gen que remodela la cromatina y controla cómo se empaqueta el ADN, afectando a muchos otros genes.",PTEN:"Gen supresor de tumores que frena la vía de crecimiento PI3K. Si se pierde, las señales de crecimiento se vuelven excesivas.",PIK3CA:"Parte de la vía de señales de crecimiento y supervivencia celular. Las mutaciones favorecen el crecimiento celular.",BRAF:"Eslabón de la vía de señales de crecimiento. La mutación frecuente V600E lo mantiene activo de forma permanente."},
 vi:{TP53:"Người bảo vệ bộ gen: phát hiện tổn thương DNA và ngăn hoặc loại bỏ tế bào hỏng. Khi mất chức năng, tế bào hỏng tiếp tục phát triển. Là gen ức chế khối u (phanh).",TERT:"Thành phần cốt lõi của telomerase, giúp tế bào phân chia không giới hạn. Khi bị bật bất thường, tế bào không già đi.",CTNNB1:"Beta-catenin, thuộc đường tín hiệu tăng trưởng Wnt. Đột biến khiến tín hiệu tăng trưởng luôn bật.",KRAS:"Công tắc của tín hiệu tăng trưởng tế bào. Đột biến khiến công tắc kẹt ở vị trí bật. Là gen sinh ung thư (chân ga).",EGFR:"Thụ thể trên bề mặt tế bào tiếp nhận tín hiệu tăng trưởng. Đột biến khiến tín hiệu luôn bật.",VHL:"Công tắc cảm nhận oxy. Khi hỏng, tế bào tưởng thiếu oxy và thúc đẩy mạch máu và khối u phát triển.",PBRM1:"Gen tái cấu trúc chromatin, kiểm soát cách DNA được đóng gói, ảnh hưởng nhiều gen khác.",PTEN:"Gen ức chế khối u, là phanh của đường tín hiệu PI3K. Khi mất, tín hiệu tăng trưởng quá mạnh.",PIK3CA:"Thuộc đường tín hiệu tăng trưởng và sống sót của tế bào. Đột biến thúc đẩy tế bào phát triển.",BRAF:"Một mắt xích trong đường tín hiệu tăng trưởng. Đột biến V600E thường gặp khiến nó hoạt động liên tục."},
 th:{TP53:"ผู้พิทักษ์จีโนม: ตรวจจับความเสียหายของ DNA และหยุดหรือกำจัดเซลล์ที่เสียหาย เมื่อยีนนี้เสีย เซลล์ที่เสียหายจะเติบโตต่อไป เป็นยีนต้านมะเร็ง (เบรก)",TERT:"ส่วนหลักของเทโลเมอเรส ทำให้เซลล์แบ่งตัวได้ไม่จำกัด เมื่อถูกเปิดผิดปกติ เซลล์จะไม่แก่",CTNNB1:"เบต้า-คาทีนิน อยู่ในวิถีสัญญาณการเจริญเติบโต Wnt การกลายพันธุ์ทำให้สัญญาณเติบโตเปิดค้างไว้",KRAS:"สวิตช์ของสัญญาณการเจริญเติบโตของเซลล์ การกลายพันธุ์ทำให้สวิตช์ค้างอยู่ที่ตำแหน่งเปิด เป็นยีนก่อมะเร็ง (คันเร่ง)",EGFR:"ตัวรับบนผิวเซลล์ที่รับสัญญาณการเจริญเติบโต การกลายพันธุ์ทำให้สัญญาณเปิดค้าง",VHL:"สวิตช์รับรู้ออกซิเจน เมื่อเสีย เซลล์จะคิดว่าขาดออกซิเจนและกระตุ้นการสร้างหลอดเลือดและการเติบโตของเนื้องอก",PBRM1:"ยีนปรับโครงสร้างโครมาติน ควบคุมการจัดเก็บ DNA มีผลต่อยีนอื่นจำนวนมาก",PTEN:"ยีนต้านมะเร็งที่เป็นเบรกของวิถี PI3K เมื่อสูญเสียไป สัญญาณการเจริญเติบโตจะแรงเกินไป",PIK3CA:"ส่วนหนึ่งของวิถีสัญญาณการเจริญเติบโตและการอยู่รอดของเซลล์ การกลายพันธุ์กระตุ้นให้เซลล์เติบโต",BRAF:"ส่วนหนึ่งของวิถีสัญญาณการเจริญเติบโต การกลายพันธุ์ V600E ที่พบบ่อยทำให้ทำงานตลอดเวลา"},
 ko:{TP53:"유전체의 수호자: DNA 손상을 감지해 손상된 세포를 멈추거나 제거합니다. 이 유전자가 고장 나면 손상된 세포가 계속 자랍니다. 종양억제유전자(브레이크)입니다.",TERT:"텔로머레이스의 핵심 부분으로 세포가 무한히 분열하게 합니다. 비정상적으로 켜지면 세포가 늙지 않습니다.",CTNNB1:"베타카테닌으로 Wnt 성장 신호 경로의 일부입니다. 변이가 생기면 성장 신호가 계속 켜져 있습니다.",KRAS:"세포 성장 신호의 스위치입니다. 변이가 생기면 스위치가 켜진 채 고정됩니다. 암유전자(액셀)입니다.",EGFR:"세포 표면에서 성장 신호를 받는 수용체입니다. 변이가 생기면 신호가 계속 켜집니다.",VHL:"산소를 감지하는 스위치입니다. 고장 나면 세포가 산소 부족으로 착각해 혈관과 종양 성장을 촉진합니다.",PBRM1:"염색질 재구성 유전자로 DNA가 포장되는 방식을 조절해 많은 유전자에 영향을 줍니다.",PTEN:"PI3K 성장 경로의 브레이크 역할을 하는 종양억제유전자입니다. 기능을 잃으면 성장 신호가 과해집니다.",PIK3CA:"세포 성장과 생존 신호 경로의 일부입니다. 변이가 생기면 세포 성장이 촉진됩니다.",BRAF:"성장 신호 경로의 한 고리입니다. 흔한 V600E 변이는 이를 계속 활성화된 상태로 만듭니다."},
 ja:{TP53:"ゲノムの守護者：DNAの損傷を検知し、傷ついた細胞を止めたり排除したりします。働きを失うと傷ついた細胞が増え続けます。がん抑制遺伝子（ブレーキ）です。",TERT:"テロメラーゼの中心で、細胞が無限に分裂できるようにします。異常に活性化すると細胞が老化しません。",CTNNB1:"βカテニンで、Wnt増殖シグナル経路の一部です。変異するとシグナルが入りっぱなしになります。",KRAS:"細胞増殖シグナルのスイッチです。変異するとスイッチが入ったまま固定されます。がん遺伝子（アクセル）です。",EGFR:"細胞表面で増殖シグナルを受け取る受容体です。変異するとシグナルが入りっぱなしになります。",VHL:"酸素を感知するスイッチです。壊れると細胞が酸素不足と勘違いし、血管と腫瘍の成長を促します。",PBRM1:"クロマチンリモデリング遺伝子で、DNAの収納のされ方を調節し、多くの遺伝子に影響します。",PTEN:"PI3K増殖経路のブレーキとなるがん抑制遺伝子です。失われると増殖シグナルが強くなりすぎます。",PIK3CA:"細胞の増殖と生存のシグナル経路の一部です。変異すると細胞の増殖が促されます。",BRAF:"増殖シグナル経路の一部です。よくあるV600E変異により常に活性化された状態になります。"},
 ka:{TP53:"გენომის მცველი: აღმოაჩენს DNA-ს დაზიანებას და აჩერებს ან ანადგურებს დაზიანებულ უჯრედებს. როცა ის მწყობრიდან გამოდის, დაზიანებული უჯრედები აგრძელებენ ზრდას. სიმსივნის სუპრესორული გენია (მუხრუჭი).",TERT:"ტელომერაზას ძირითადი ნაწილი, რომელიც უჯრედს შეუზღუდავად გაყოფის საშუალებას აძლევს. არანორმალურად ჩართვისას უჯრედი არ ბერდება.",CTNNB1:"ბეტა-კატენინი, Wnt ზრდის სიგნალის გზის ნაწილი. მუტაციის დროს ზრდის სიგნალი მუდამ ჩართული რჩება.",KRAS:"უჯრედის ზრდის სიგნალების ამომრთველი. მუტაცია ამომრთველს ჩართულ მდგომარეობაში ამყარებს. ონკოგენია (აქსელერატორი).",EGFR:"უჯრედის ზედაპირზე მდებარე რეცეპტორი, რომელიც ზრდის სიგნალებს იღებს. მუტაციისას სიგნალი მუდამ ჩართულია.",VHL:"ჟანგბადის შემგრძნობი ამომრთველი. მწყობრიდან გასვლისას უჯრედს ჰგონია, რომ ჟანგბადი აკლია და სისხლძარღვებისა და სიმსივნის ზრდას ხელს უწყობს.",PBRM1:"ქრომატინის გადაწყობის გენი, რომელიც აკონტროლებს DNA-ს შეფუთვას და მრავალ სხვა გენზე მოქმედებს.",PTEN:"სიმსივნის სუპრესორული გენი, PI3K ზრდის გზის მუხრუჭი. დაკარგვისას ზრდის სიგნალები ზედმეტად ძლიერდება.",PIK3CA:"უჯრედის ზრდისა და გადარჩენის სიგნალის გზის ნაწილი. მუტაციები უჯრედის ზრდას ასტიმულირებს.",BRAF:"ზრდის სიგნალის გზის რგოლი. გავრცელებული V600E მუტაცია მას მუდმივად აქტიურს ხდის."}

 zh:{h:"具体的 DNA 变化（最常见）",wait:"正在读取具体变化……",fail:"暂时读不到具体碱基数据。",ch:"最常见的碱基替换",x:"次",hot:"最常见的位置",indel:"另有插入/缺失",
  intro:"怎么看这张表：左边的字母（如 TP53）是基因的“名字标签”，基因是 DNA 上一长段，里面有成百上千个碱基。DNA 只有 4 种碱基：A 腺嘌呤、G 鸟嘌呤、C 胞嘧啶、T 胸腺嘧啶。癌症里的“突变”就是某个位置的碱基被换掉，例如 C 变成 T。最右列显示这个基因里最常见的具体替换和位置（来自同一批病人的数据）。同一个基因在不同病人里可能变在不同位置，每个肿瘤通常有很多处变化，不是只错一个碱基。"},
 en:{h:"Specific DNA change (most common)",wait:"Loading specific changes...",fail:"Base-level data is not available right now.",ch:"Most common base substitution",x:"times",hot:"Most frequent position",indel:"Also insertions/deletions",
  intro:"How to read this table: the letters on the left (e.g. TP53) are just gene name tags. A gene is a long stretch of DNA containing hundreds or thousands of bases. DNA has only 4 bases: A adenine, G guanine, C cytosine, T thymine. A cancer 'mutation' is a base swapped at some position, e.g. C changed to T. The right column shows the most common specific substitution and position in that gene (from the same patients). The same gene can change at different positions in different patients, and a tumor usually has many changes, not just one base."},
 es:{h:"Cambio concreto en el ADN (más frecuente)",wait:"Cargando cambios concretos...",fail:"Los datos a nivel de base no están disponibles ahora.",ch:"Sustitución de base más común",x:"veces",hot:"Posición más frecuente",indel:"Además inserciones/deleciones",
  intro:"Cómo leer la tabla: las letras de la izquierda (p. ej. TP53) son solo el nombre del gen. Un gen es un tramo largo de ADN con cientos o miles de bases. El ADN tiene 4 bases: A adenina, G guanina, C citosina, T timina. Una «mutación» en el cáncer es una base cambiada en cierta posición, p. ej. C por T. La columna derecha muestra la sustitución y la posición más comunes en ese gen. Un tumor suele tener muchos cambios, no solo una base."},
 vi:{h:"Thay đổi DNA cụ thể (phổ biến nhất)",wait:"Đang tải thay đổi cụ thể...",fail:"Hiện chưa có dữ liệu mức nucleotide.",ch:"Thay thế base phổ biến nhất",x:"lần",hot:"Vị trí thường gặp nhất",indel:"Ngoài ra có chèn/mất đoạn",
  intro:"Cách đọc bảng: chữ cái bên trái (vd. TP53) chỉ là tên gen. Gen là một đoạn DNA dài chứa hàng trăm đến hàng nghìn base. DNA chỉ có 4 base: A adenin, G guanin, C xitozin, T timin. “Đột biến” ung thư là một base bị thay ở một vị trí, vd. C thành T. Cột phải cho thấy thay thế và vị trí phổ biến nhất trong gen đó. Một khối u thường có nhiều thay đổi, không chỉ một base."},
 th:{h:"การเปลี่ยนแปลง DNA ที่เฉพาะเจาะจง (พบบ่อยสุด)",wait:"กำลังโหลด...",fail:"ยังไม่มีข้อมูลระดับเบส",ch:"การแทนที่เบสที่พบบ่อยสุด",x:"ครั้ง",hot:"ตำแหน่งที่พบบ่อยสุด",indel:"และมีการแทรก/ขาดหาย",
  intro:"วิธีอ่านตาราง: ตัวอักษรด้านซ้าย (เช่น TP53) เป็นเพียงชื่อยีน ยีนคือส่วนของ DNA ที่ยาว มีเบสหลายร้อยถึงหลายพันตัว DNA มี 4 เบส: A อะดีนีน, G กัวนีน, C ไซโทซีน, T ไทมีน “การกลายพันธุ์” ในมะเร็งคือเบสถูกเปลี่ยนที่ตำแหน่งหนึ่ง เช่น C เป็น T คอลัมน์ขวาแสดงการแทนที่และตำแหน่งที่พบบ่อยที่สุดในยีนนั้น เนื้องอกมักมีการเปลี่ยนแปลงหลายจุด ไม่ใช่เบสเดียว"},

  intro:"표 읽는 법: 왼쪽 글자(예: TP53)는 유전자 이름표일 뿐입니다. 유전자는 수백~수천 개 염기가 있는 긴 DNA 구간입니다. DNA 염기는 A 아데닌, G 구아닌, C 사이토신, T 티민 네 가지입니다. 암의 '변이'는 어떤 위치의 염기가 바뀐 것으로, 예를 들어 C가 T로 바뀝니다. 오른쪽 열은 그 유전자에서 가장 흔한 치환과 위치입니다. 종양에는 보통 여러 변화가 있으며 염기 하나만 틀린 것이 아닙니다."},

  intro:"表の見方：左の文字（例 TP53）は遺伝子の名前ラベルです。遺伝子は数百〜数千の塩基を含む長いDNA領域です。DNAの塩基は4種類：A アデニン、G グアニン、C シトシン、T チミン。がんの「変異」とはある位置の塩基が置き換わること（例：CがTに）です。右の列はその遺伝子で最も多い置換と位置です。腫瘍には通常多くの変化があり、塩基1つだけではありません。"},

function drugCell(sym){
 const t=DC[LANG],r=DR[sym];
 let h;
 if(r) h="<b>"+esc(t[r[0]])+"</b><br><span class='note'>"+esc(r[1])+"</span>";
 else if(BIG.has(sym)) h=esc(t.big);
 else if(NODRUG.has(sym)) h=esc(t.none);
 else h=esc(t.unk);
 return h+"<br><a class='note' target='_blank' rel='noopener' href='https://www.oncokb.org/gene/"+encodeURIComponent(sym)+"'>"+esc(t.db)+"</a>";
}

const MUT={};
function bn(b){const m=BASE[LANG]||BASE.en;return b+(m[b]?"("+m[b]+")":"")}
function summarize(muts){
 const R={};
 muts.forEach(m=>{
  const sym=(m.gene&&m.gene.hugoGeneSymbol)||m.hugoGeneSymbol;if(!sym)return;
  const r=R[sym]||(R[sym]={n:0,sub:{},pos:{},indel:0});r.n++;
  const ref=m.referenceAllele,alt=m.variantAllele||m.tumorSeqAllele2;
  if(ref&&alt&&ref.length===1&&alt.length===1&&/[ACGT]/.test(ref)&&/[ACGT]/.test(alt)){
   r.sub[ref+">"+alt]=(r.sub[ref+">"+alt]||0)+1;
   const k=(m.proteinChange||"")+"|chr"+m.chr+":"+m.startPosition+"|"+ref+">"+alt;
   r.pos[k]=(r.pos[k]||0)+1;
  }else r.indel++;
 });
 return R;
}
function topOf(o){let b=null,c=0;for(const k in o)if(o[k]>c){b=k;c=o[k]}return b?[b,c]:null}
async function loadMut(studyId,mpId,genes){
 if(MUT[studyId])return MUT[studyId];
 const ids=genes.map(g=>g.entrez).filter(Boolean);
 if(!ids.length)throw new Error("no entrez");
 let muts=null;
 try{
  muts=await get("/molecular-profiles/"+mpId+"/mutations/fetch?projection=DETAILED",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({sampleListId:studyId+"_sequenced",entrezGeneIds:ids})});
 }catch(e){
  muts=[];
  const parts=await Promise.all(ids.map(id=>get("/molecular-profiles/"+mpId+"/mutations?sampleListId="+studyId+"_sequenced&entrezGeneId="+id+"&projection=DETAILED").catch(()=>[])));
  parts.forEach(a=>muts.push(...a));
 }
 if(!muts||!muts.length)throw new Error("empty");
 return MUT[studyId]=summarize(muts);
}
function fillMut(R){
 const t=NW[LANG];
 document.querySelectorAll("[data-mut]").forEach(td=>{
  const r=R[td.dataset.mut];if(!r){td.textContent="—";return}
  let h="";const s=topOf(r.sub);
  if(s){const [a,b]=s[0].split(">");h+="<b>"+esc(bn(a)+" → "+bn(b))+"</b> ("+s[1]+" "+t.x+")";}
  const ps=topOf(r.pos);
  if(ps){const [pc,loc,ch]=ps[0].split("|");h+="<br><span class='note'>"+t.hot+": "+esc((pc?pc+" ":"")+loc+" ("+ch.replace(">","→")+") ×"+ps[1])+"</span>";}
  if(r.indel)h+="<br><span class='note'>"+t.indel+": "+r.indel+"</span>";
  td.innerHTML=h||"—";
 });
}

let studies=[];
let LAST=null;      // 最近一次查询（切换语言时用来重新显示）
const CACHE={};     // 已查过的突变统计，切换语言时不必再联网

async function get(path,opt){
 const r=await fetch(API+path,opt);
 if(!r.ok) throw new Error("HTTP "+r.status);
 return r.json();
}

async function loadStudies(){
 if(studies.length) return;
 studies=await get("/studies?projection=SUMMARY&pageSize=2000");
}

function esc(s){return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}

async function search(keep){
 const raw=(keep===true&&LAST)?LAST.raw:document.getElementById("q").value.trim();
 const out=document.getElementById("out");
 if(!raw){out.innerHTML=RES[LANG].empty;return}
 out.innerHTML=RES[LANG].wait;
 try{
  await loadStudies();
  const find=k=>studies.filter(s=>((s.name||"")+" "+(s.cancerType?s.cancerType.name:"")+" "+(s.description||"")).toLowerCase().includes(k));
  // 先用输入本身（中文走对照表）查；查不到再用多语言名称对照表
  let hits=find((ZH[raw]||raw).toLowerCase());
  if(!hits.length){
   const key=mapName(raw);
   if(key) hits=find(key==="head"?"head and neck":key);
  }
  // 优先 TCGA 项目
  hits.sort((a,b)=>(b.studyId.includes("tcga_pan_can_atlas")-a.studyId.includes("tcga_pan_can_atlas"))||((b.allSampleCount||0)-(a.allSampleCount||0)));
  if(!hits.length){out.innerHTML=RES[LANG].none;return}
  if(hits.length>1){
   let h="";
   hits.slice(0,12).forEach(s=>{h+="<a class='cand' onclick=\"show('"+s.studyId+"')\">"+esc(s.name)+"（"+RES[LANG].n+" "+(s.allSampleCount||"?")+"）</a>"});
   out.innerHTML=h+"<div id='res'></div>";
  } else out.innerHTML="<div id='res'></div>";
  const pick=(keep===true&&LAST&&hits.some(h=>h.studyId===LAST.studyId))?LAST.studyId:hits[0].studyId;
  LAST={raw:raw,studyId:pick};
  show(pick);
 }catch(e){out.innerHTML=esc(e.message)}
}

async function show(studyId){
 let box=document.getElementById("res");
 if(LAST) LAST.studyId=studyId;
 box.innerHTML=RES[LANG].wait;
 try{
  const st=studies.find(s=>s.studyId===studyId);
  const profiles=await get("/studies/"+studyId+"/molecular-profiles");
  const mp=profiles.find(p=>p.molecularAlterationType==="MUTATION_EXTENDED");
  if(!mp){box.innerHTML=RES[LANG].none;return}
  // 两种请求格式依次尝试（接口格式我没法在这里实测）
  const bodies=[
   {studyIds:[studyId]},
   {molecularProfileIds:[mp.molecularProfileId],sampleListId:studyId+"_sequenced"}
  ];
  let list=CACHE[studyId]||null;
  for(const b of bodies){
   if(list&&list.length) break;
   try{
    list=await get("/mutated-genes/fetch",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});
   }catch(e){list=null}
  }
  if(!list||!list.length){box.innerHTML=RES[LANG].none;return}
  CACHE[studyId]=list;
  const total=st.sequencedSampleCount||st.allSampleCount||1;
  list=list.map(g=>({sym:g.hugoGeneSymbol,entrez:g.entrezGeneId,n:g.numberOfAlteredCases,p:100*g.numberOfAlteredCases/(g.numberOfProfiledCases||total)}))
   .sort((a,b)=>b.n-a.n).slice(0,15);
  let h="<h2>"+esc(st.name)+"</h2><p class='note' style='background:#eef6ff;padding:8px;border-radius:6px'>"+esc(NW[LANG].intro)+"</p><p>"+RES[LANG].n+": "+total+". "+RES[LANG].top+"</p><table><tr><th>"+RES[LANG].g+"</th><th>"+RES[LANG].p+"</th><th></th><th>"+RES[LANG].d+"</th><th>"+esc(NW[LANG].h)+"</th><th>"+esc(DC[LANG].h)+"</th></tr>";
  list.forEach(g=>{
   h+="<tr><td><b>"+esc(g.sym)+"</b>"+(GN[g.sym]?"<br><span class='note'>"+esc(GN[g.sym])+"</span>":"")+"</td><td>"+g.p.toFixed(1)+"%</td><td style='width:25%'><div class='bar' style='width:"+Math.min(100,g.p)+"%'></div></td><td>"+esc((GI[LANG]&&GI[LANG][g.sym])||(LANG==="zh"&&GENE[g.sym])||(BIG.has(g.sym)?RES[LANG].big:RES[LANG].gen))+"</td><td data-mut='"+esc(g.sym)+"'>"+esc(NW[LANG].wait)+"</td><td>"+drugCell(g.sym)+"</td></tr>";
  });
  h+="</table><p class='note'>"+esc(DC[LANG].note)+"</p><p class='note'>"+esc(RES[LANG].limit)+"</p><p>"+esc(RES[LANG].how)+"</p>";
  box.innerHTML=h;
  loadMut(studyId,mp.molecularProfileId,list).then(fillMut).catch(()=>{document.querySelectorAll("[data-mut]").forEach(td=>td.textContent=NW[LANG].fail)});
 }catch(e){box.innerHTML=esc(e.message)}
}

document.getElementById("q").addEventListener("keydown",e=>{if(e.key==="Enter")search()});
</script>
